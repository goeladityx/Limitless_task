<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pellet Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --wash:#F7F9FC; --wash2:#EEF3FA;
  --line:#E3E9F2; --line2:#CFD9E8;
  --ink:#0B1220; --ink2:#3D4C63; --muted:#7B8AA3;
  --blue:#1B4FD8; --blue-d:#123AA6; --blue-s:#E9EFFF;
  --hold:#B26B00; --hold-s:#FFF5E4;
  --ok:#0E7A5A; --ok-s:#E4F5EE;
  --r:10px; --rs:6px;
  --sh:0 1px 2px rgba(11,18,32,.04), 0 8px 24px -12px rgba(11,18,32,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wash);color:var(--ink2);
  font:15px/1.6 "Instrument Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}

/* ---------------- top bar ---------------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1440px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:11px;margin-right:auto}
.glyph{width:30px;height:30px;border-radius:8px;background:var(--ink);position:relative;flex:none}
.glyph::after{content:"";position:absolute;inset:7px 6px;border-radius:2px;
  background:linear-gradient(to top,var(--hold) 0 22%,var(--blue) 22% 100%)}
.mark h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;color:var(--ink);
  margin:0;letter-spacing:-.01em;line-height:1.1}
.mark p{margin:0;font-size:12px;color:var(--muted)}
.pick{display:flex;align-items:center;gap:8px}
.pick label{font-size:12px;color:var(--muted)}
select.co{background:var(--paper);border:1px solid var(--line2);border-radius:var(--rs);
  padding:7px 10px;color:var(--ink);font-size:14px;max-width:230px}
nav.tabs{max-width:1440px;margin:0 auto;padding:0 32px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 13px 12px;color:var(--muted);font-size:14.5px;
  border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
nav.tabs .cnt{font:500 11px/1 "JetBrains Mono",monospace;background:var(--blue-s);color:var(--blue);
  border-radius:99px;padding:2px 6px;margin-left:6px}

main{max-width:1440px;margin:0 auto;padding:28px 32px 80px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:27px;color:var(--ink);
  margin:0 0 6px;letter-spacing:-.015em}
.lede{margin:0 0 22px;color:var(--muted);max-width:64ch}

/* ---------------- stat strip ---------------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat b{display:block;font:500 23px/1.15 "JetBrains Mono",monospace;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.flag b{color:var(--hold)}

/* ---------------- question rows ---------------- */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;box-shadow:var(--sh);overflow:hidden}
.qhead{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.qtag{font:500 10.5px/1.7 "JetBrains Mono",monospace;color:var(--muted);background:var(--wash2);
  border-radius:99px;padding:2px 9px;flex:none}
.sentence{flex:1;font-size:16.5px;color:var(--ink);line-height:2.1}
.sentence select{appearance:none;background:var(--blue-s);border:0;border-bottom:1.5px solid var(--blue);
  color:var(--blue-d);font-weight:600;font-size:15.5px;padding:2px 22px 2px 8px;border-radius:5px 5px 0 0;
  cursor:pointer;max-width:270px;text-overflow:ellipsis}
.sentence select:hover{background:#DDE7FF}
.sentence .wrapsel{position:relative;display:inline-block}
.sentence .wrapsel::after{content:"";position:absolute;right:8px;top:50%;margin-top:-2px;
  border:4px solid transparent;border-top-color:var(--blue-d);pointer-events:none}
.sentence input{background:var(--blue-s);border:0;border-bottom:1.5px solid var(--blue);width:88px;
  color:var(--blue-d);font-weight:600;padding:2px 8px;border-radius:5px 5px 0 0;text-align:center}
.run{background:var(--ink);color:#fff;border:0;border-radius:var(--rs);padding:8px 16px;
  font-weight:600;font-size:14px;flex:none;align-self:center}
.run:hover{background:var(--blue)}
.run.busy{opacity:.5;pointer-events:none}
.why{padding:0 18px 14px;margin:-6px 0 0;font-size:13px;color:var(--muted)}

/* ---------------- answer ---------------- */
.ans{border-top:1px solid var(--line);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ans .vtop{display:flex;align-items:center;gap:10px;padding:11px 18px;flex-wrap:wrap}
.ans.a .vtop{background:var(--ok-s)} .ans.w .vtop{background:var(--hold-s)}
.badge{font:600 10.5px/1 "Instrument Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;
  padding:5px 9px;border-radius:99px}
.ans.a .badge{background:var(--ok);color:#fff} .ans.w .badge{background:var(--hold);color:#fff}
.vtop .rs{font-size:13px;color:var(--ink2)}
.body{padding:16px 18px;white-space:pre-wrap;color:var(--ink);font-size:16px;line-height:1.65}
.fix{margin:0;padding:12px 18px;background:var(--blue-s);border-top:1px solid var(--line);
  color:var(--blue-d);font-size:14px;font-weight:500}
.prov{padding:9px 18px;border-top:1px solid var(--line);background:var(--wash);
  font:400 11.5px/1.6 "JetBrains Mono",monospace;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}

/* ---------------- charts ---------------- */
.chart h4{margin:0 0 10px;font:500 11px/1 "Instrument Sans",sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:minmax(88px,150px) 1fr minmax(76px,auto);gap:11px;align-items:center;font-size:13.5px}
.brow .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--wash2);border-radius:3px;height:20px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px}
.fill.neg{background:var(--hold)}
.brow .vl{font:500 12.5px/1 "JetBrains Mono",monospace;text-align:right;color:var(--ink);
  font-variant-numeric:tabular-nums}
.split{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}


/* -------- split answer: the person on the left, the evidence on the right -------- */
.split2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);border-top:1px solid var(--line)}
.left{padding:22px 24px 20px;min-width:0}
/* On a wide screen the sentence and the picture sit side by side rather than
   the picture being pushed a screen down from the number it illustrates. */
.lsplit{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1100px){.lsplit{grid-template-columns:minmax(260px,0.8fr) minmax(0,1.2fr);align-items:start}}
.lsplit .lwords{min-width:0}.lsplit .lvis{min-width:0}
.right{border-left:1px solid var(--line);background:#0B1220;min-width:0;overflow:hidden}
.right .rh{padding:9px 16px;border-bottom:1px solid #1E2A3E;display:flex;gap:9px;align-items:center;
  font:500 10.5px/1 "Instrument Sans";letter-spacing:.13em;text-transform:uppercase;color:#7FA0E8}
.right .rh b{background:#16233A;color:#93B0F5;border-radius:99px;padding:3px 8px;
  font:500 10px/1 "JetBrains Mono",monospace;letter-spacing:.04em}
.sqlwrap{max-height:360px;overflow:auto;padding:12px 16px 16px}
.sqlwrap pre{margin:0 0 14px;font:400 11.5px/1.6 "JetBrains Mono",monospace;color:#C6D4EE;
  white-space:pre-wrap;word-break:break-word}
.sqlwrap .kw{color:#7FA0E8;font-weight:500}
.sqlwrap .pm{color:#E0A458}
.sqlwrap .cap{font:500 10px/1 "Instrument Sans";letter-spacing:.12em;text-transform:uppercase;
  color:#5C7194;margin:0 0 6px}
.defbox{padding:11px 16px;border-top:1px solid #1E2A3E;background:#0E1929}
.defbox .dl{font:400 11.5px/1.8 "JetBrains Mono",monospace;color:#8FA8CC}
.defbox .dl b{color:#E0A458;font-weight:500}
.headnum{font:500 clamp(30px,4vw,42px)/1.05 "JetBrains Mono",monospace;color:var(--ink);
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0 0 4px}
.ans.w .headnum{color:var(--hold)}
.headsub{font-size:15px;color:var(--muted);margin:0 0 14px;max-width:46ch}
.detail{font-size:14.5px;color:var(--ink2);white-space:pre-wrap;line-height:1.62;
  margin:0;max-width:62ch}
.mchart{margin:16px 0 6px}
.mchart svg{width:100%;height:190px;display:block;overflow:visible}
.mchart .gl{stroke:var(--line);stroke-width:1}
.mchart .lbl{font:400 10px "JetBrains Mono",monospace;fill:var(--muted)}
.mchart rect.seg{cursor:pointer}
.mchart rect.seg:hover{opacity:.75}
.keys{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.keys span{display:flex;align-items:center;gap:7px}
.keys i{width:10px;height:10px;border-radius:2px;display:inline-block}
.vend{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.vend h5{margin:0 0 3px;font:600 13.5px/1.3 "Instrument Sans";color:var(--ink)}
.vend .cap{margin:0 0 11px;font-size:12.5px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:1fr 92px 88px;gap:12px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}
.vrow .vn{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .vq{font:500 13px/1 "JetBrains Mono",monospace;text-align:right;color:var(--ink2);
  font-variant-numeric:tabular-nums}
.cred{font:600 10.5px/1 "Instrument Sans";letter-spacing:.09em;text-transform:uppercase;
  padding:5px 8px;border-radius:99px;text-align:center}
.cred.high{background:var(--ok-s);color:var(--ok)}
.cred.moderate{background:var(--blue-s);color:var(--blue-d)}
.cred.low{background:var(--hold-s);color:var(--hold)}
@media (max-width:1000px){.split2{grid-template-columns:1fr}
  .right{border-left:0;border-top:1px solid var(--line)}}

/* ---------------- tables ---------------- */
.scroll{overflow:auto;max-height:440px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font:400 13px/1.5 "JetBrains Mono",monospace}
th{position:sticky;top:0;background:var(--wash);text-align:left;padding:9px 14px;
  border-bottom:1px solid var(--line);color:var(--muted);font-weight:500;font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--ink2)}
tbody tr:hover td{background:var(--wash)}
td.nil{color:var(--hold);font-style:italic}

/* ---------------- misc panels ---------------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.panel .ph{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.ref{font:500 13.5px/1 "JetBrains Mono",monospace;color:var(--ink)}
.qn{font-size:14px;color:var(--ink2)}
.meta{font:400 12.5px/1.7 "JetBrains Mono",monospace;color:var(--muted);margin-bottom:10px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{background:var(--paper);border:1px solid var(--line2);border-radius:var(--rs);padding:6px 12px;
  font:500 13px/1 "JetBrains Mono",monospace;color:var(--ink2)}
.opt:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-s)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.qchip{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:6px 14px;
  cursor:pointer;transition:.13s;
  font-size:13.5px;color:var(--ink2)}
.qchip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-s);color:var(--blue-d);font-weight:600}
.qchip:hover{border-color:var(--line2);background:var(--wash)}
.empty{padding:40px;text-align:center;background:var(--paper);border:1px dashed var(--line2);
  border-radius:var(--r);color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:4px 0 12px}
.dfield label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.dfield select,.dfield input{width:100%;background:var(--paper);border:1px solid var(--line2);
  border-radius:var(--rs);padding:8px 10px;color:var(--ink)}
.save{background:var(--blue);color:#fff;border:0;border-radius:var(--rs);padding:8px 16px;font-weight:600;font-size:14px}
.save:hover{background:var(--blue-d)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:99px;font-size:14px;z-index:60;box-shadow:var(--sh)}

@media (max-width:700px){
  .qhead{flex-wrap:wrap}.run{width:100%}.sentence{font-size:16px;line-height:2.2}
  main{padding:20px 16px 60px}.bar{padding:12px 16px}nav.tabs{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------------------------------------------------------- figures */
.fig{margin:0 0 18px;border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;
  background:linear-gradient(180deg,#fff,var(--wash))}
.fig figcaption{font:600 14px/1.3 "Instrument Sans",system-ui;color:var(--ink);
  letter-spacing:-.005em;margin-bottom:12px}
.fignote{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.svgbox{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
/* Column charts want vertical room. Row charts size themselves to their rows,
   and forcing a floor on those only adds dead space around a small drawing. */
.capchart,.heatsvg{min-height:280px}
.chart .grid{stroke:#EDF1F7;stroke-width:1}
.chart .ytick{font:400 11px "JetBrains Mono",monospace;fill:var(--muted);text-anchor:end}
.chart .yr{fill:#B9C3D2}
.chart .mark{pointer-events:none}
.chart .mark.fl{fill:var(--blue)}.chart .mark.ex{fill:#7FA0EE}.chart .mark.ce{fill:#C9D8F8}
.chart .mark.rule{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3;fill:none}
.chart .axis{stroke:var(--line2);stroke-width:1}
.chart .tick{font:400 11px "JetBrains Mono",monospace;fill:var(--muted);text-anchor:middle}
.chart .hit{fill:transparent;cursor:crosshair}
/* One tooltip for the whole console. It wraps, because a chart readout is a sentence and
   a sentence set on one line runs off the side of the screen. */
.tip{position:fixed;z-index:9999;width:max-content;max-width:min(320px,44vw);
  pointer-events:none;white-space:normal;overflow-wrap:break-word;
  background:var(--ink);color:#fff;border-radius:9px;padding:10px 13px;
  font:400 12.5px/1.55 "Instrument Sans",system-ui;
  box-shadow:0 10px 32px rgba(11,18,32,.32);opacity:0;transform:translateY(3px);
  transition:opacity .1s ease,transform .1s ease}
.tip.on{opacity:1;transform:none}
.key{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;
  font:400 11.5px "Instrument Sans",system-ui;color:var(--muted)}
.key .k{display:inline-flex;align-items:center;gap:6px}
.key .k i{width:11px;height:11px;border-radius:3px;background:var(--line2);display:block}
.key .fl i{background:var(--blue)}.key .ex i{background:#7FA0EE}.key .ce i{background:#C9D8F8}

/* headroom: a month with room and a month that is oversold must never look alike */
.hchart .cap{fill:#EEF2F9;stroke:#DCE4F0;stroke-width:1}
.hchart .free{fill:var(--blue)}
.hchart .sch{fill:#EFC188}
.hchart .spill{fill:rgba(200,119,11,.30);stroke:var(--hold);stroke-width:1.5;
  stroke-dasharray:4 3}
.hchart .blab{font:500 10px "JetBrains Mono",monospace;fill:#fff;text-anchor:middle}
.hchart .yr{fill:var(--line2)}
.hg{cursor:crosshair}
.hg:hover .free{fill:var(--blue-d)}
.key .hk.free i{background:var(--blue)}
.key .hk.sch i{background:#EFC188}
.key .hk.cap i{background:#EEF2F9;border:1px solid #DCE4F0}

/* runway */
.runway{display:flex;flex-direction:column;gap:7px}
.rw{display:grid;grid-template-columns:170px 1fr 96px;gap:11px;align-items:center;
  padding:3px 0;cursor:default}
.rw:hover{background:var(--blue-s);border-radius:6px}
.rwn{overflow:hidden}
.rwn b{display:block;font:600 12.5px/1.3 "Instrument Sans";color:var(--ink);
  white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.rwn span{font:400 10.5px "JetBrains Mono",monospace;color:var(--muted)}
.rwt{position:relative;height:17px;background:var(--wash);border-radius:4px;overflow:hidden}
.rwt i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:4px}
.rwt .room{background:#D7E2FA}
.rwt .need{background:var(--blue);height:9px;top:4px}
.rw.bad .rwt .need{background:var(--hold)}
.rwv{font:500 11.5px "JetBrains Mono",monospace;color:var(--ink2);text-align:right}
.rw.bad .rwv{color:var(--hold)}

/* heat grid, drawn at its own size and allowed to scroll rather than squashed */
.hscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:6px;margin:0 -2px}
.heatsvg{display:block;max-width:none}
.heatsvg .hlab{font:500 11px "Instrument Sans";fill:var(--muted);text-anchor:middle}
.heatsvg .hmat{font:600 12.5px "Instrument Sans";fill:var(--ink);text-anchor:end}
.heatsvg .hval{font:500 12px "JetBrains Mono",monospace;fill:var(--ink);text-anchor:middle;
  pointer-events:none}
.heatsvg .hnil{fill:#F4F6FA;stroke:#E7ECF4;stroke-width:1;stroke-dasharray:3 3}
.heatsvg .hcell{cursor:crosshair}
.heatsvg .hcell:hover rect{stroke:var(--ink);stroke-width:2}
.hkey{display:flex;align-items:center;gap:10px;margin-top:12px}
.hke{font:400 11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.hramp{display:flex;flex:1;height:9px;border-radius:99px;overflow:hidden;max-width:260px}
.hramp i{flex:1;display:block}

/* supply band */
.band{fill:rgba(27,79,216,.10)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round}
.ln.fl{stroke:var(--blue)}
.ln.ex{stroke:#7FA0EE;stroke-dasharray:4 3}
.ln.ce{stroke:#C9D8F8}

/* cash strip */
.cash{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.cw{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 4px;border-radius:8px;cursor:default;transition:background .12s}
.cw:hover{background:var(--blue-s)}
.cw i{width:100%;background:var(--blue);border-radius:3px;display:block;align-self:stretch}
.cw b{font:500 11.5px "JetBrains Mono",monospace;color:var(--ink)}
.cw span{font:400 10px "JetBrains Mono",monospace;color:var(--muted)}
.cw.nil i{background:var(--line)}
.cw.nil b{color:var(--muted)}
.cw.late{background:var(--hold-s);border:1px dashed #E2B570}
.cw.late i{background:var(--hold)}
.cw.late b{color:var(--hold)}

/* donut */
.donut{width:180px;height:180px;display:block;margin:0 auto}
.donut circle{cursor:crosshair;transition:opacity .12s}
.donut circle:hover{opacity:.8}
.donut .dn{text-anchor:middle;font:500 17px "JetBrains Mono",monospace;fill:var(--ink)}
.donut .ds{text-anchor:middle;font:400 11px "Instrument Sans";fill:var(--muted)}

/* treemap */
.tree{display:flex;flex-wrap:wrap;gap:4px}
.tc{min-height:56px;border-radius:6px;padding:8px 9px;display:flex;flex-direction:column;
  justify-content:flex-end;cursor:default;transition:transform .1s}
.tc:hover{transform:translateY(-2px)}
.tc b{font:600 11.5px/1.25 "Instrument Sans";color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tc span{font:500 11px "JetBrains Mono",monospace;color:var(--ink2);margin-top:3px}

/* ---------------------------------------------------------------- follow-ups */
.next{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.next .nl{font:500 11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
.chip{background:#fff;border:1px solid var(--line2);color:var(--blue-d);border-radius:99px;
  padding:6px 14px;font:500 12.5px "Instrument Sans";cursor:pointer;transition:.13s}
.chip:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.qcard.focus{border-color:var(--blue);box-shadow:0 6px 24px rgba(27,79,216,.13)}
.fbar{display:flex;align-items:center;justify-content:space-between;
  background:var(--blue-s);margin:-15px -16px 13px;padding:8px 16px;
  border-radius:11px 11px 0 0;font:500 11.5px "JetBrains Mono",monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.xf{background:none;border:0;color:var(--blue-d);cursor:pointer;
  font:500 11.5px "Instrument Sans";text-decoration:underline}

/* ---------------------------------------------------------------- definitions */
.dwrap{display:flex;flex-direction:column;gap:18px;padding:2px 0 4px}
.dsec{padding:2px 0}
.dq{margin:0 0 9px;font:500 13px "Instrument Sans";color:var(--ink2)}
.dopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}
.dopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;cursor:pointer;background:#fff;transition:.13s}
.dopt:hover{border-color:var(--line2);background:var(--wash)}
.dopt.on{border-color:var(--blue);background:var(--blue-s);
  box-shadow:inset 0 0 0 1px var(--blue)}
.dopt input{margin-top:2px;accent-color:var(--blue);flex:none}
.dopt .ob b{display:block;font:600 13px/1.35 "Instrument Sans";color:var(--ink);margin-bottom:4px}
.dopt .ob span{font:400 12px/1.5 "Instrument Sans";color:var(--muted)}
.dopt.on .ob span{color:var(--ink2)}
.dnum{display:flex;align-items:center;gap:10px}
.dnum input{width:120px;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;
  font:500 13px "JetBrains Mono",monospace}
.dnum span{font:400 12px "JetBrains Mono",monospace;color:var(--muted)}

/* ---------------------------------------------------------------- definition diff */
.diff{border:1px solid var(--blue);background:var(--blue-s);border-radius:11px;
  padding:14px 16px;margin-bottom:18px;opacity:0;transform:translateY(-8px);
  transition:opacity .35s ease,transform .35s ease}
.diff.in{opacity:1;transform:none}
.diff .dh{margin-bottom:10px}
.diff .dh b{display:block;font:600 13.5px "Instrument Sans";color:var(--ink)}
.diff .dh span{font:400 12px "Instrument Sans";color:var(--ink2)}
.diff .dr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 0;
  opacity:0;animation:dslide .45s ease forwards}
@keyframes dslide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.diff .w{font:500 11px "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;
  color:var(--blue-d);min-width:130px}
.diff .was{font:400 12.5px "Instrument Sans";color:var(--muted);
  text-decoration:line-through;text-decoration-color:#B9C6DA}
.diff .arw{color:var(--blue)}
.diff .now{font:600 12.5px "Instrument Sans";color:var(--ink);
  background:#fff;border-radius:5px;padding:2px 8px;box-shadow:0 1px 3px rgba(27,79,216,.14)}
@media (prefers-reduced-motion:reduce){.diff,.diff .dr{transition:none;animation:none;opacity:1}}
@media (max-width:760px){
  .rw{grid-template-columns:120px 1fr 74px}
  .heat{font-size:9px}
  .dopts{grid-template-columns:1fr}
}

/* ---------------------------------------------------------------- resolve in place */
.inq{margin-top:14px;border:1px solid #E2B570;background:var(--hold-s);
  border-radius:10px;padding:13px 14px}
.inqh b{display:block;font:600 13px "Instrument Sans";color:var(--ink);margin-bottom:2px}
.inqh span{font:400 12px "Instrument Sans";color:var(--ink2)}
.inqr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 0;border-top:1px solid rgba(200,119,11,.24);margin-top:10px}
.inqq b{display:block;font:500 12.5px/1.4 "Instrument Sans";color:var(--ink)}
.inqq span{font:400 11px "JetBrains Mono",monospace;color:#8A6118}
.inqo{display:flex;flex-wrap:wrap;gap:7px}
.inqb{background:#fff;border:1px solid #E2B570;color:#8A5A12;border-radius:7px;
  padding:7px 13px;font:500 12.5px "Instrument Sans";cursor:pointer;transition:.13s}
.inqb:hover:not(:disabled){background:var(--hold);border-color:var(--hold);color:#fff}
.inqb:disabled{opacity:.55;cursor:default}
.inqm{margin:9px 0 0;font:400 11.5px "Instrument Sans";color:#8A6118}
.flash{animation:fl .9s ease}
@keyframes fl{0%{background:var(--blue-s)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* ---------------------------------------------------------------- follow-up in place */
.nextwrap{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chainhost .chain{margin-top:12px;border-left:2px solid var(--blue);padding-left:14px}
.chainhost .qcard{margin:0;border-color:var(--line2);box-shadow:none}
.chainhost .qtag{background:var(--blue);color:#fff}

/* ---------------------------------------------------------------- headline */
/* A figure is the thing the eye should land on, so it gets the display size. A phrase
   like "Every month" set at 46px just fills the column and buries the answer under it. */
.headnum.word{font:600 27px/1.15 "Fraunces",Georgia,serif;letter-spacing:-.01em}
.headnum.long{font-size:23px;line-height:1.2}
.headnum.word.long{font-size:21px}

/* ---------------------------------------------------------------- tables */
.tbl{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:#fff}
.tcap{font:600 11px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:11px 13px 10px;border-bottom:1px solid var(--line);
  background:var(--wash)}
.tbl .scroll{max-height:330px;overflow:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:#fff;text-align:left;font:600 11px "Instrument Sans";
  color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  z-index:1}
.tbl th.num{text-align:right}
.tbl td{padding:8px 12px;border-bottom:1px solid #F1F4F9;color:var(--ink2);white-space:nowrap}
.tbl td.num{text-align:right;font:500 12px "JetBrains Mono",monospace;color:var(--ink);
  font-variant-numeric:tabular-nums}
.tbl td.num.neg{color:var(--hold)}
.tbl td.nil{color:#B9C3D2;font-style:italic}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--blue-s)}

/* the detail paragraph wants a comfortable measure, not a gutter */

/* ---------------------------------------------------------------- audit trail */
.work{margin-top:18px;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:linear-gradient(180deg,#fff,var(--wash))}
.workh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:0;cursor:pointer;padding:12px 14px;text-align:left;
  border-bottom:1px solid var(--line)}
.workh .wt{font:600 12.5px "Instrument Sans";color:var(--ink)}
.workh .wc{font:500 10.5px "JetBrains Mono",monospace;color:var(--blue-d);
  background:var(--blue-s);border-radius:99px;padding:3px 9px}
.workh.shut{border-bottom-color:transparent}
.workh::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);
  border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);
  margin-left:2px;transition:transform .16s}
.workh.shut::after{transform:rotate(-45deg) translateY(1px)}
.workb{padding:6px 14px 12px}
.wsteps{margin:0;padding:0;list-style:none;counter-reset:w}
.wsteps li{counter-increment:w;padding:9px 0 9px 30px;position:relative;
  border-bottom:1px solid #F1F4F9}
.wsteps li:last-child{border-bottom:0}
.wsteps li::before{content:counter(w);position:absolute;left:0;top:10px;
  width:19px;height:19px;border-radius:50%;background:var(--blue-s);color:var(--blue-d);
  font:600 10.5px/19px "JetBrains Mono",monospace;text-align:center}
.wsteps li:last-child::before{background:var(--blue);color:#fff}
.wline{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.wlab{font:500 12.5px/1.4 "Instrument Sans";color:var(--ink2)}
.wval{font:500 13.5px "JetBrains Mono",monospace;color:var(--ink);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.wval i{font:400 10.5px "Instrument Sans";color:var(--muted);font-style:normal}
.wsteps li:last-child .wval{font-size:15px;color:var(--blue-d)}
.wdet{margin:3px 0 0;font:400 11.5px/1.5 "Instrument Sans";color:var(--muted)}
.wfoot{margin:11px 0 0;font:400 11px/1.5 "Instrument Sans";color:var(--muted);
  border-top:1px dashed var(--line2);padding-top:9px}
.wnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.wn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.wn b{display:block;font:500 13px "JetBrains Mono",monospace;color:var(--ink);
  font-variant-numeric:tabular-nums}
.wn span{font:400 10.5px "Instrument Sans";color:var(--muted)}

/* ---------------------------------------------------------------- capacity chart */
.capchart .cap{fill:#F6F8FC;stroke:#D7DFEC;stroke-width:1.2}
.capchart .free{fill:#fff;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:4 3}
.capchart .req{fill:var(--blue)}
.capchart .sch{fill:#E9A94F}
.capchart .spill{fill:rgba(203,58,58,.26);stroke:#C33;stroke-width:1.5;stroke-dasharray:4 3}
.capchart .blab{font:600 12px "JetBrains Mono",monospace;text-anchor:middle}
.capchart .blab.in{fill:var(--blue-d)}
.capchart .blab.full{fill:var(--muted)}
.capchart .blab.over{fill:#C33}
.capchart .state{font:500 10.5px "Instrument Sans";text-anchor:middle;fill:var(--muted)}
.capchart .state.oversold{fill:#C33;font-weight:700}
.capchart .state.full{fill:var(--hold)}
.capchart .state.room{fill:var(--blue)}
.cg{cursor:crosshair}
.cg:hover .cap{fill:#EDF2FA}
.key .ck.free i{background:#fff;border:1.2px dashed var(--blue)}
.key .ck.req i{background:var(--blue)}
.key .ck.sch i{background:#E9A94F}
.key .ck.spill i{background:rgba(203,58,58,.26);border:1px dashed #C33}

/* what can move */
.movel{display:flex;flex-direction:column;gap:6px}
.mv{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;
  padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#fff}
.mv.can{border-left:3px solid var(--blue)}
.mv.cant{border-left:3px solid var(--hold);background:var(--wash)}
.mv b{font:600 12.5px "Instrument Sans";color:var(--ink)}
.mvw{font:500 12.5px "JetBrains Mono",monospace;color:var(--ink)}
.mvt{font:400 11px "Instrument Sans";color:var(--muted);white-space:nowrap}

/* ---------------------------------------------------------------- spread + make/buy */
.spread .stem{stroke:#DDE4F0;stroke-width:3}
.spread .dot{fill:var(--blue)}
.spread .slab{font:500 15px "Instrument Sans";fill:var(--ink2);text-anchor:end}
.spread .sval{font:500 15px "JetBrains Mono",monospace;fill:var(--ink);text-anchor:start}
.spread .stag{font:600 11px "Instrument Sans";text-anchor:middle;fill:var(--muted)}
.spread .best .dot{fill:#0E7A5A}
.spread .best .stag{fill:#0E7A5A}
.spread .best .sval{fill:#0E7A5A}
.spread .worst .dot{fill:var(--hold)}
.spread .worst .stag{fill:var(--hold)}
.spread .worst .sval{fill:var(--hold)}
.sp{cursor:crosshair}
.sp:hover .dot{r:8}

.mbchart .gap{stroke:#CBD6E8;stroke-width:4;stroke-linecap:round}
.mbchart .make{fill:var(--blue)}
.mbchart .buy{fill:#0E7A5A}
.mbchart .buywins .gap{stroke:#A8D6C4}
.mbchart .makewins .gap{stroke:#F0CFA0}
.mbchart .slab{font:500 15px "Instrument Sans";fill:var(--ink2);text-anchor:end}
.mbchart .sval{font:500 15px "JetBrains Mono",monospace;text-anchor:start}
.mbchart .sval.good{fill:#0E7A5A}
.mbchart .sval.bad{fill:var(--hold)}
.mb{cursor:crosshair}
.mb:hover .make,.mb:hover .buy{r:8}
.key .mk.make i{background:var(--blue);border-radius:50%}
.key .mk.buy i{background:#0E7A5A;border-radius:50%}

.headnum.md{font-size:38px}
.headnum.sm{font-size:31px;line-height:1.12}
.headnum.xs{font-size:25px;line-height:1.18}
.headnum.word.md{font-size:25px}
.headnum.word.sm{font-size:22px}
.headnum.word.xs{font-size:19px}

.mbmoney .buy{fill:#0E7A5A}
.mbmoney .make{fill:var(--blue)}
.mbmoney .slab{font:600 14px "Instrument Sans";fill:var(--ink);text-anchor:end}
.mbmoney .sval{font:500 14px "JetBrains Mono",monospace;fill:var(--ink)}
.mbmoney .gaplab{font:600 14px "Instrument Sans"}
.mbmoney .gaplab.bad{fill:var(--hold)}
.mbmoney .gaplab.good{fill:#0E7A5A}
.mm{cursor:crosshair}
.mm:hover rect{opacity:.85}

.qchart .qb rect{fill:#9DB8F2}
.qchart .qb.tot rect{fill:var(--blue)}
.qchart .qb.final rect{fill:var(--ink)}
.qchart .qlab{font:500 14px "Instrument Sans";fill:var(--ink2);text-anchor:end}
.qchart .qlab.tot{font-weight:700;fill:var(--ink)}
.qchart .qval{font:500 14px "JetBrains Mono",monospace;fill:var(--ink2)}
.qchart .qval.tot{font-weight:600;fill:var(--ink)}
.qb{cursor:crosshair}
.qb:hover rect{opacity:.85}

.capchart .planline{stroke:var(--ink2);stroke-width:2;stroke-dasharray:5 3}
.key .ck.planline i{background:none;border-top:2px dashed var(--ink2);height:0;
  border-radius:0;align-self:center}
.split i.empty{background:var(--line);width:100%}

/* ---------------------------------------------------------------- finish the story */
.sintro{margin-bottom:34px;max-width:60ch}
.skicker{margin:0 0 8px;font:500 11.5px "JetBrains Mono",monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue)}
.sintro h2{margin:0 0 10px;font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:clamp(28px,3.4vw,40px);line-height:1.1;letter-spacing:-.022em;color:var(--ink)}
.slede{margin:0;font-size:15.5px;color:var(--muted)}

/* one line down the page, unlit ahead of you and filled behind, so five answers read as
   one argument with a direction rather than five cards in a column */
.thread{position:relative;padding-left:52px;counter-reset:beat}
.thread::before{content:"";position:absolute;left:15px;top:6px;bottom:70px;width:2px;
  background:var(--line)}
.sstep{position:relative;margin-bottom:52px}
.sstep::before{content:"";position:absolute;left:-37px;top:6px;height:0;width:2px;
  background:var(--blue);transition:height .7s ease}
.sstep.lit::before{height:calc(100% + 52px)}
.sbeat{display:flex;align-items:center;gap:11px;margin-bottom:7px}
.sn{position:absolute;left:-52px;top:-3px;width:32px;height:32px;border-radius:50%;
  background:#fff;border:2px solid var(--line2);color:var(--muted);
  display:grid;place-items:center;font:600 13px "JetBrains Mono",monospace;
  transition:.45s ease;z-index:1}
.sstep.lit .sn{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 0 0 6px rgba(27,79,216,.12)}
.sbt{font:500 12.5px "JetBrains Mono",monospace;letter-spacing:.05em;color:var(--muted);
  text-transform:uppercase}
.sq{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(21px,2.4vw,29px);
  line-height:1.2;color:var(--ink);letter-spacing:-.02em;margin-bottom:16px;max-width:24ch}
.sstep{opacity:.45;transform:translateY(10px);
  transition:opacity .55s ease,transform .55s ease}
.sstep.lit{opacity:1;transform:none}
.safter{margin:16px 0 0;padding:0 0 0 16px;border-left:3px solid var(--blue);
  font-size:15px;line-height:1.65;color:var(--ink2);max-width:64ch}
.send{margin-top:10px;padding:26px 28px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,#fff,var(--wash))}
.send h3{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;
  color:var(--ink)}
.send p{margin:0 0 16px;color:var(--ink2);max-width:70ch}
.cta{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 22px;
  font:600 14px "Instrument Sans";cursor:pointer}
.cta:hover{background:var(--blue)}
@media (prefers-reduced-motion:reduce){
  .sstep{opacity:1;transform:none;transition:none}
  .sstep::before{transition:none}}
@media (max-width:700px){.thread{padding-left:36px}.thread::before{left:11px}
  .sn{left:-36px;width:26px;height:26px;font-size:11px}
  .sstep::before{left:-24px}
  .sq{font-size:19px}}

.scard{margin:0;border:1px solid var(--line);box-shadow:none}
.scard .qtag{display:none}
.scard .qhead{padding:14px 16px}
.scard .sentence{font-size:15px}

.runchart .runarea{fill:rgba(27,79,216,.10)}
.runchart .runline{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round}
.runchart .runwant{stroke:var(--hold);stroke-width:2;stroke-dasharray:6 4}
.runchart .runwantlab{font:600 11px "Instrument Sans";fill:var(--hold)}
.runchart .runhit{stroke:#0E7A5A;stroke-width:1.5;stroke-dasharray:3 3}
.runchart .runcross{fill:#0E7A5A;stroke:#fff;stroke-width:2}
.runchart .runcrosslab{font:600 11px "JetBrains Mono",monospace;fill:#0E7A5A;
  text-anchor:middle}
.runchart .rmark{pointer-events:none}
.runchart .rmark.rule{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3}
.runchart .rmark.dot{fill:var(--blue);stroke:#fff;stroke-width:2}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="mark">
      <div class="glyph" aria-hidden="true"></div>
      <div><h1>Pellet Console</h1><p>Answers you can check, or a reason you cannot</p></div>
    </div>
    <div class="pick">
      <label for="tenant">Company</label>
      <select class="co" id="tenant"></select>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;
  if(txt!==undefined&&txt!==null)n.textContent=txt;return n;}
function add(parent,...kids){kids.forEach(k=>k&&parent.appendChild(k));return parent;}
const api=async(p,o)=>{const r=await fetch(p,o);
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r.json()};
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
/* This is India. Money is read in lakhs and crores, and a nine figure number written as
   163,824,466 is a number nobody in the room can say out loud. Every rupee figure gets a
   short form beside it, and the digits themselves group 2-1-2 the way they do here. */
const IN=(v,d)=>Number(v).toLocaleString('en-IN',{maximumFractionDigits:d===undefined?2:d,
                                                  minimumFractionDigits:0});
const fmt=v=>v===null||v===undefined?'':typeof v==='number'?IN(v):String(v);
function shortIN(v){
  const a=Math.abs(v),sg=v<0?'-':'';
  if(a>=1e7) return sg+IN(a/1e7,2).replace(/\.00$/,'')+' Cr';
  if(a>=1e5) return sg+IN(a/1e5,2).replace(/\.00$/,'')+' L';
  if(a>=1e3) return sg+IN(Math.round(a),0);
  return sg+IN(a,a<10?2:0);
}
/* Rupees, written the way an owner would say them. */
const rs=v=>'\u20b9'+shortIN(v);
const rsFull=v=>'\u20b9'+IN(Math.round(v),0);
const tn=v=>IN(v,v<100?1:0)+' t';
function toast(m){const t=el('div','toast',m);document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

const S={tenant:null,page:'story',questions:[],metrics:[],options:{},summary:{},answers:{},defs:null,lastTenant:null,focus:null};

/* Each question is a sentence with the choices sitting inside it. Change a dropdown and it
   becomes your own question, which is why there is no separate "custom query" screen. */
const SENT={
  open_commitment:[t=>'How much is left to deliver on ',{p:'tender_ref'},'?'],
  order_book:['What have we contracted to deliver, and how much of it is left?'],
  capacity_free:['When have I got capacity free over the next ',{p:'months'},' months?'],
  month_pressure:['What is sitting in ',{p:'month'},', and what could move?'],
  capacity_compare:['Why can I make less in ',{p:'month_a'},' than in ',{p:'month_b'},'?'],
  fit_new_tender:['If I sell ',{p:'tonnes'},' tonnes for delivery by ',{p:'by_month'},
                  ', can I make it?'],

                   'could I have it made?'],

/* ---------------------------------------------------------------- charts (inline svg-free) */
function barChart(title,rows,opts={}){
  const box=el('div','chart');box.appendChild(el('h4',null,title));
  const wrap=el('div','bars');
  const max=Math.max(...rows.map(r=>Math.abs(r.value)),1);
  rows.forEach(r=>{
    const row=el('div','brow');
    row.appendChild(el('div','nm',r.label));
    const tr=el('div','track');
    const f=el('div','fill'+(r.value<0?' neg':''));
    f.style.width=(Math.abs(r.value)/max*100).toFixed(1)+'%';
    tr.appendChild(f);row.appendChild(tr);
    row.appendChild(el('div','vl',opts.format?opts.format(r.value):fmt(Math.round(r.value))));
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  return box;
}
function splitBar(title,parts){
  /* An empty title is no title, rather than an empty heading holding open ten pixels of
     margin. And a part worth nothing gets no legend entry: sixteen of the eighteen
     dispatch answers were carrying a permanent "loads with nothing raised  0". */
  const box=el('div','chart');
  if(title)box.appendChild(el('h4',null,title));
  const shown=parts.filter(p=>Number(p.value)>0);
  const total=shown.reduce((a,p)=>a+Number(p.value),0)||1;
  const bar=el('div','split');
  shown.forEach(p=>{const i=el('i');
    i.style.width=(p.value/total*100)+'%';i.style.background=p.color;
    i.title=p.label+': '+IN(Math.round(p.value));bar.appendChild(i);});
  if(!shown.length)bar.appendChild(el('i','empty'));
  box.appendChild(bar);
  const lg=el('div','legend');
  shown.forEach(p=>{const s=el('span');const b=el('b');b.style.background=p.color;
    s.appendChild(b);
    s.appendChild(document.createTextNode(p.label+'  '+IN(Math.round(p.value))));
    lg.appendChild(s);});
  box.appendChild(lg);return box;
}
function tipEl(){let t=document.getElementById('tip');
  if(!t){t=el('div','tip');t.id='tip';document.body.appendChild(t);}return t;}

/* Promised tonnage per month, stacked by product, hover a block for the exact figure. */
function monthChart(rows){
  const months=[...new Set(rows.map(r=>r.month))].sort();
  const grades=[...new Set(rows.map(r=>r.grade_code))].sort();
  const byM={};months.forEach(m=>byM[m]={});
  rows.forEach(r=>byM[r.month][r.grade_code]=(byM[r.month][r.grade_code]||0)+r.tonnes);
  const tot=m=>grades.reduce((a,g)=>a+(byM[m][g]||0),0);
  const peak=Math.max(...months.map(tot),1);
  const W=680,H=170,PL=46,PB=24,gap=(W-PL)/months.length,bw=gap*0.62;
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);
    Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n;};
  const box=el('div','mchart');
  const svg=mk('svg',{viewBox:'0 0 '+W+' '+(H+PB),preserveAspectRatio:'none'});
  [0,0.5,1].forEach(f=>{const y=H-f*H;
    svg.appendChild(mk('line',{x1:PL,x2:W,y1:y,y2:y,class:'gl'}));
    const tx=mk('text',{x:PL-8,y:y+3,'text-anchor':'end',class:'lbl'});
    tx.textContent=fmt(Math.round(peak*f));svg.appendChild(tx);});
  const tip=tipEl();
  months.forEach((m,i)=>{
    let acc=0;
    grades.forEach((g,gi)=>{
      const v=byM[m][g]||0;if(!v)return;
      const h=v/peak*H,x=PL+i*gap+(gap-bw)/2,y=H-acc-h;acc+=h;
      const r=mk('rect',{x:x,y:y,width:bw,height:Math.max(1,h),
        fill:GRADE_COL[gi%5],rx:2,class:'seg'});
      r.addEventListener('mousemove',function(e){tip.classList.add('on');
        tip.textContent=m+'   '+g+'   '+fmt(Math.round(v))+' t     month total '+fmt(Math.round(tot(m)))+' t';
        tip.style.left=Math.min(innerWidth-320,e.clientX+14)+'px';
        tip.style.top=(e.clientY-40)+'px';});
      r.addEventListener('mouseleave',function(){tip.classList.remove('on');});
      svg.appendChild(r);
    });
    if(i%2===0){const tx=mk('text',{x:PL+i*gap+gap/2,y:H+16,'text-anchor':'middle',class:'lbl'});
      tx.textContent=m.slice(5)+'/'+m.slice(2,4);svg.appendChild(tx);}
  });
  box.appendChild(svg);
  const keys=el('div','keys');
  grades.forEach((g,gi)=>{const sp=el('span'),ic=el('i');
    ic.style.background=GRADE_COL[gi%5];add(sp,ic,el('span',null,g));keys.appendChild(sp);});
  box.appendChild(keys);
  return box;
}

/* Who keeps their word.
   This read promised_t and credibility off a row set that carries neither, so it would
   have printed "NaN t" and the literal word "undefined" the first time a commitment was
   confirmed and the chart became reachable. It now reads what the metric returns and
   leaves out a column it has no data for. */
function vendorList(vs){
  const box=el('div','vend');
  box.appendChild(el('p','cap','Taken out of email threads, not from purchase orders. '+
    'Only promises somebody has confirmed are counted.'));
  const has=k=>vs.some(v=>v&&v[k]!==undefined&&v[k]!==null);
  const showT=has('promised_t'),showBand=has('credibility')||has('kept_pct');
  vs.slice(0,12).forEach(function(v){
    const r=el('div','vrow');
    const promised=v.promises!==undefined?v.promises:v.promised_times;
    const nm=el('div','vn');
    nm.appendChild(el('b',null,v.vendor));
    nm.appendChild(el('span',null,plural(promised||0,'promise')
      +(v.confirmed?', '+v.confirmed+' confirmed':'')));
    r.appendChild(nm);
    if(showT)r.appendChild(el('div','vq',tn(v.promised_t)));
    if(showBand){
      const band=v.credibility
        ||(v.kept_pct>=97?'high':v.kept_pct>=85?'moderate':'low');
      r.appendChild(el('div','cred '+band,band));
    }
    box.appendChild(r);
  });
  if(vs.length>12)box.appendChild(el('p','cap',
    'and '+(vs.length-12)+' more, smaller than these.'));
  return box;
}

const NS='http://www.w3.org/2000/svg';
const sv=(t,a)=>{const n=document.createElementNS(NS,t);
  Object.entries(a||{}).forEach(([k,v])=>n.setAttribute(k,v));return n;};
function figure(title,node,note){
  const box=el('figure','fig');
  box.appendChild(el('figcaption',null,title));
  box.appendChild(node);
  if(note)box.appendChild(el('p','fignote',note));
  return box;

/* One tooltip for the whole console, following the cursor, so every chart explains itself
   in the same voice and in the place the eye already is. */
let TIP=null;
function tipNode(){
  if(!TIP){TIP=el('div','tip');document.body.appendChild(TIP);}
  return TIP;
}
/* One tooltip for the whole console, following the cursor, so every chart explains itself
   in the same voice and in the place the eye already is.

   It is placed after the text is set, not before, because its width depends on what it
   says. And it is kept inside the window on both axes: a readout that runs off the right
   edge, or under the panel beside it, is a readout nobody can finish reading. */
function readout(box){
  let mx=0,my=0;
  function place(){
    const n=tipNode();
    if(!n.classList.contains('on'))return;
    const pad=16,w=n.offsetWidth,h=n.offsetHeight;
    let x=mx+pad,y=my+pad;
    if(x+w>innerWidth-10)x=Math.max(10,mx-w-pad);
    if(y+h>innerHeight-10)y=Math.max(10,my-h-pad);
    n.style.left=Math.max(10,x)+'px';
    n.style.top=Math.max(10,y)+'px';
  }
  box.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;place();});
  box.addEventListener('mouseleave',()=>{tipNode().classList.remove('on');});
  return t=>{
    const n=tipNode();
    n.textContent=t||'';
    n.classList.toggle('on',!!t);
    if(t)requestAnimationFrame(place);   // measure it once it holds the text
  };
}

/* ---- one column per month, standing for what the plant can make. It fills from the
   bottom with what is already spoken for and the empty part at the top is the answer.
   A column that fills past its own frame is oversold and is drawn breaking out of it. */
function capacityChart(rows){
  const W=660,H=400,PT=32,PB=52,LX=54,GAP=6;
  const peak=niceTop(Math.max(1,...rows.map(r=>Math.max(r.capacity_t,r.committed_t))));
  const plot=H-PT-PB, bw=(W-LX-10)/rows.length;
  const hOf=v=>Math.max(0,v)/peak*plot;
  const base=PT+plot;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart capchart'});
  gridY(svg,LX,W-6,PT,base,peak,4);

  rows.forEach((r,i)=>{
    const x=LX+i*bw+GAP/2, w=bw-GAP;
    const cap=hOf(r.capacity_t), sch=hOf(r.scheduled_t), req=hOf(r.required_t);
    const g=sv('g',{class:'cg '+r.state});

    // the frame is the month's own capacity. Everything is read against it.
    g.appendChild(sv('rect',{x:x,y:base-cap,width:w,height:Math.max(2,cap),rx:4,class:'cap'}));
    // contracted to a private buyer for this month, which cannot move
    if(sch>0)g.appendChild(sv('rect',
      {x:x,y:base-sch,width:w,height:sch,rx:3,class:'sch'}));
    // the pace the tender deadlines need, which can move inside its window
    if(req>0)g.appendChild(sv('rect',
      {x:x,y:base-sch-req,width:w,height:req,rx:3,class:'req'}));
    // and what is left, which is the answer to the question
    if(r.free_t>0)g.appendChild(sv('rect',
      {x:x+1,y:base-cap,width:w-2,height:hOf(r.free_t),rx:3,class:'free'}));
    if(r.state==='oversold')g.appendChild(sv('rect',
      {x:x-2,y:base-sch-req,width:w+4,height:(sch+req)-cap,rx:3,class:'spill'}));

    // the figure the eye is hunting for, on the bar
    if(r.state==='room'&&hOf(r.free_t)>20){
      const lb=sv('text',{x:x+w/2,y:base-cap+16,class:'blab in'});
      lb.textContent=IN(Math.round(r.free_t),0);
      g.appendChild(lb);
    }else if(r.state==='oversold'){
      const lb=sv('text',{x:x+w/2,y:base-(sch+req)-8,class:'blab over'});
      lb.textContent='\u2212'+IN(Math.round(r.oversold_t),0);
      g.appendChild(lb);
    }else{
      const lb=sv('text',{x:x+w/2,y:base-cap-8,class:'blab full'});
      lb.textContent=Math.round(r.used_pct)+'%';
      g.appendChild(lb);
    }

    g.addEventListener('mouseenter',()=>say(
      MONTHNAME(r.month)+'  \u00b7  the plant has managed '+tn(r.capacity_t)+
      '.  Contracted to private buyers '+tn(r.scheduled_t)+
      ', tender pace '+tn(r.required_t)+
      (r.state==='oversold'?'.  Oversold by '+tn(r.oversold_t)+'.'
       :r.state==='full'?'.  Only '+tn(r.free_t)+' left, which is '+
         Math.round(100-r.used_pct)+'% of the month.'
       :'.  '+tn(r.free_t)+' free, '+Math.round(100-r.used_pct)+'% of the month.')));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);

    const tk=sv('text',{x:x+w/2,y:H-30,class:'tick'});
    tk.textContent=MONTHSHORT(r.month);
    svg.appendChild(tk);
    if(r.month.slice(5)==='01'||i===0){
      const yr=sv('text',{x:x+w/2,y:H-17,class:'tick yr'});
      yr.textContent=r.month.slice(0,4);
      svg.appendChild(yr);
    }
    const st=sv('text',{x:x+w/2,y:H-4,class:'state '+r.state});
    st.textContent=r.state==='oversold'?'over':r.state==='full'?'full':'room';
    svg.appendChild(st);
  });
  box.appendChild(svg);
  const key=el('div','key');
  [['free','room to sell'],['req','pace the tender deadlines need'],
   ['sch','contracted to a private buyer that month'],
   ['spill','more than the plant can make']].forEach(([c,t])=>{
    const k=el('span','k ck '+c);k.appendChild(el('i'));
    k.appendChild(document.createTextNode(t));key.appendChild(k);});
  box.appendChild(key);
  return figure('Every month against what the plant can make',box,
    'Each column is one month at full capacity. It fills from the bottom with what is '+
    'already spoken for, and the white space at the top is what you could still sell.');
}

/* What can be slowed down and what cannot. A list, because it is a list. */
function moveList(movable,pinned){
  const box=el('div','svgbox'),say=readout(box);
  const g=el('div','movel');
  movable.forEach(x=>{
    const row=el('div','mv can');
    add(row,el('b',null,x.plant),
            el('span','mvw',tn(x.tonnes)),
            el('span','mvt','due '+MONTHNAME(x.deadline)+', can slow down'));
    row.addEventListener('mouseenter',()=>say(
      x.plant+': '+tn(x.tonnes)+' of this month\u2019s pace comes from a tender due '+
      MONTHNAME(x.deadline)+'. Push it later and the deadline still holds.'));
    row.addEventListener('mouseleave',()=>say(''));
    g.appendChild(row);
  });
  (pinned||[]).forEach(x=>{
    const row=el('div','mv cant');
    add(row,el('b',null,x.plant),
            el('span','mvw',tn(x.tonnes)),
            el('span','mvt','due this month, cannot move'));
    g.appendChild(row);
  });
  box.appendChild(g);
  return box;
}

/* ---- the order book: one row per contract, showing how far along it is. */
function bookChart(rows){
