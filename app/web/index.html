/* ---- the wall of deadlines. One column per month a contract falls due in, and the
   height is what is still to deliver by then, because that is the question. The old
   version drew the awarded tonnage as the bar and what had shipped as a sliver inside it,
   which made every future month look like an empty box, and split the axis by product so
   "Mar 27" appeared three times running. */
function deadlineChart(rows){
  const byMonth={};
  rows.forEach(r=>{
    const m=byMonth[r.month]||(byMonth[r.month]={month:r.month,remaining:0,awarded:0,
                                                delivered:0,contracts:0,grades:{}});
    m.remaining+=r.remaining; m.awarded+=r.awarded; m.delivered+=r.delivered;
    m.contracts+=r.contracts;
    m.grades[r.grade_code]=(m.grades[r.grade_code]||0)+r.remaining;
  });
  const months=Object.values(byMonth).sort((x,y)=>x.month<y.month?-1:1);
  const W=600,H=310,PT=32,PB=48,LX=54,GAP=Math.min(16,220/months.length);
  const peak=niceTop(Math.max(1,...months.map(m=>m.remaining)));
  const plot=H-PT-PB,bw=(W-LX-12)/months.length,base=PT+plot;
  const hOf=v=>Math.max(0,v)/peak*plot;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart capchart'});
  gridY(svg,LX,W-6,PT,base,peak,4);
  months.forEach((m,i)=>{
    const x=LX+i*bw+GAP/2,w=Math.max(10,bw-GAP);
    const h=hOf(m.remaining);
    const g=sv('g',{class:'cg'});
    g.appendChild(sv('rect',{x:x,y:base-h,width:w,height:Math.max(2,h),rx:4,class:'req'}));
    const lb=sv('text',{x:x+w/2,y:base-h-8,class:'blab in'});
    lb.textContent=IN(Math.round(m.remaining),0);
    g.appendChild(lb);
    const gr=Object.entries(m.grades).sort((p,q)=>q[1]-p[1]);
    g.addEventListener('mouseenter',()=>say(
      MONTHNAME(m.month)+': '+(m.contracts===1?'one contract closes':
        m.contracts+' contracts close')+' that month with '+tn(m.remaining)+
      ' still to deliver, out of '+tn(m.awarded)+' contracted.  '+
      gr.map(([k,v])=>k+' '+tn(v)).join(',  ')));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
    const tk=sv('text',{x:x+w/2,y:H-28,class:'tick'});
    tk.textContent=MONTHSHORT(m.month);
    svg.appendChild(tk);
    const yr=sv('text',{x:x+w/2,y:H-15,class:'tick yr'});
    yr.textContent=m.month.slice(0,4);
    svg.appendChild(yr);
    const ct=sv('text',{x:x+w/2,y:H-3,class:'state room'});
    ct.textContent=m.contracts===1?'1 contract':m.contracts+' contracts';
    svg.appendChild(ct);
  });
  box.appendChild(svg);
  return figure('When it all falls due',box,
    'Each column is one month, and its height is the tonnage that has to be out of the '+
    'gate by then. Hover for the products and the contracts behind it.');
}

/* ---- one month, split into what is a promise about it and what is only a pace. Drawn as
   a bar against capacity rather than a ring, because a ring cannot show an overshoot. */
function monthSplit(r){
  const W=560,H=170,PT=44,LX=18,BH=58;
  const peak=niceTop(Math.max(r.capacity_t,r.scheduled_t+r.required_t));
  const wOf=v=>Math.max(0,v)/peak*(W-LX*2);
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart capchart'});
  const cap=wOf(r.capacity_t),sch=wOf(r.scheduled_t),req=wOf(r.required_t);
  svg.appendChild(sv('rect',{x:LX,y:PT,width:cap,height:BH,rx:5,class:'cap'}));
  const g1=sv('g',{class:'cg'});
  g1.appendChild(sv('rect',{x:LX,y:PT,width:sch,height:BH,rx:5,class:'sch'}));
  g1.addEventListener('mouseenter',()=>say('Contracted to private buyers for this month: '+
    tn(r.scheduled_t)+', which is '+Math.round(r.scheduled_t/r.capacity_t*100)+
    '% of what the plant can make. This cannot move without their agreement.'));
  g1.addEventListener('mouseleave',()=>say(''));
  svg.appendChild(g1);
  const g2=sv('g',{class:'cg'});
  g2.appendChild(sv('rect',{x:LX+sch,y:PT,width:req,height:BH,rx:5,class:'req'}));
  g2.addEventListener('mouseenter',()=>say('Pace the tender deadlines need: '+
    tn(r.required_t)+', which is '+Math.round(r.required_t/r.capacity_t*100)+
    '% of what the plant can make. Nobody promised this month, so it can move.'));
  g2.addEventListener('mouseleave',()=>say(''));
  svg.appendChild(g2);
  if(r.over_t>0)
    svg.appendChild(sv('rect',{x:LX+cap,y:PT-4,width:(sch+req)-cap,height:BH+8,rx:4,
      class:'spill'}));
  const cl=sv('line',{x1:LX+cap,x2:LX+cap,y1:PT-14,y2:PT+BH+14,class:'axis'});
  svg.appendChild(cl);
  const ct=sv('text',{x:LX+cap,y:PT-20,class:'tick'});
  ct.textContent='plant can make '+IN(Math.round(r.capacity_t),0);
  svg.appendChild(ct);
  const st=sv('text',{x:LX,y:PT+BH+26,class:'tick'});
  st.setAttribute('text-anchor','start');
  st.textContent=r.over_t>0?('oversold by '+IN(Math.round(r.over_t),0)+' t')
                           :(IN(Math.round(r.free_t),0)+' t still free');
  svg.appendChild(st);
  box.appendChild(svg);
  const key=el('div','key');
  [['sch','contracted for this month, cannot move'],
   ['req','tender pace, can move'],['spill','more than the plant can make']]
    .forEach(([c,t])=>{const k=el('span','k ck '+c);k.appendChild(el('i'));
      k.appendChild(document.createTextNode(t));key.appendChild(k);});
  box.appendChild(key);
  return figure('Where '+MONTHNAME(r.month)+' goes',box,
    'Measured against what the plant has managed in that month, not against a nameplate.');
}

/* ---- two calendar months, every year the register holds, side by side. */
function compareChart(r){
  const rows=[].concat(r.a.rows.map(x=>({...x,side:'a'})),
                       r.b.rows.map(x=>({...x,side:'b'})));
  const W=600,H=310,PT=30,PB=48,LX=54,GAP=7;
  const peak=niceTop(Math.max(1,...rows.map(x=>Math.max(x.actual_t,x.planned_t))));
  const plot=H-PT-PB,bw=(W-LX-10)/rows.length,base=PT+plot;
  const hOf=v=>Math.max(0,v)/peak*plot;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart capchart'});
  gridY(svg,LX,W-6,PT,base,peak,4);
  rows.forEach((x,i)=>{
    const px=LX+i*bw+GAP/2,w=bw-GAP;
    const g=sv('g',{class:'cg'});
    // the plan is a marker across the bar, not a bar behind it. Behind it, it is
    // completely hidden every month the plant met or beat plan, which is most of them.
    g.appendChild(sv('rect',{x:px,y:base-hOf(x.actual_t),width:w,height:hOf(x.actual_t),
      rx:3,class:x.side==='a'?'sch':'req'}));
    g.appendChild(sv('line',{x1:px-3,x2:px+w+3,y1:base-hOf(x.planned_t),
      y2:base-hOf(x.planned_t),class:'planline'}));
    g.addEventListener('mouseenter',()=>say(
      MONTHNAME(x.month)+': planned '+tn(x.planned_t)+', made '+tn(x.actual_t)+
      ', which is '+Math.round(x.actual_t/(x.planned_t||1)*100)+'% of plan.'));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
    const tk=sv('text',{x:px+w/2,y:H-28,class:'tick'});
    tk.textContent=x.month.slice(0,4);
    svg.appendChild(tk);
  });
  const la=sv('text',{x:LX+((W-LX-10)/rows.length)*r.a.rows.length/2,y:H-10,class:'tick'});
  la.textContent=MONS[+r.month_a.slice(5,7)];
  svg.appendChild(la);
  const lb=sv('text',{x:LX+((W-LX-10)/rows.length)*(r.a.rows.length+r.b.rows.length/2),
    y:H-10,class:'tick'});
  lb.textContent=MONS[+r.month_b.slice(5,7)];
  svg.appendChild(lb);
  box.appendChild(svg);
  const key=el('div','key');
  [['sch',MONS[+r.month_a.slice(5,7)]],['req',MONS[+r.month_b.slice(5,7)]],
   ['planline','what the plan said']].forEach(([c,t])=>{
    const k=el('span','k ck '+c);k.appendChild(el('i'));
    k.appendChild(document.createTextNode(t));key.appendChild(k);});
  box.appendChild(key);
  return figure('Every year the register holds for these two months',box,
    'The pale bar is the plan, the solid bar what the plant actually made.');
}

/* ---- how much could be made by each month, running total, with the order drawn across
   it. Read the date off where the curve crosses the line. This is the answer to "can I
   make it", which is a date and not a yes. */
function runwayChart(r){
  const rows=r.rows.slice(0,18);
  const W=680,H=340,PT=30,PB=48,LX=64,RX=14;
  const peak=niceTop(Math.max(r.tonnes*1.25,rows[rows.length-1].cumulative_t));
  const plot=H-PT-PB,base=PT+plot;
  const x=i=>LX+i*((W-LX-RX)/Math.max(1,rows.length-1));
  const y=v=>base-Math.max(0,v)/peak*plot;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart runchart'});
  gridY(svg,LX,W-RX,PT,base,peak,4);

  // the running total, as an area so the shape of the year is visible
  svg.appendChild(sv('polygon',{class:'runarea',
    points:rows.map((m,i)=>x(i)+','+y(m.cumulative_t)).join(' ')+' '+
           x(rows.length-1)+','+base+' '+x(0)+','+base}));
  svg.appendChild(sv('polyline',{class:'runline',
    points:rows.map((m,i)=>x(i)+','+y(m.cumulative_t)).join(' ')}));

  // the order itself, drawn across
  svg.appendChild(sv('line',{x1:LX,x2:W-RX,y1:y(r.tonnes),y2:y(r.tonnes),class:'runwant'}));
  const wl=sv('text',{x:LX+6,y:y(r.tonnes)-8,class:'runwantlab'});
  wl.textContent='the order, '+tn(r.tonnes);
  svg.appendChild(wl);

  rows.forEach((m,i)=>{
    const hit=sv('rect',{x:x(i)-((W-LX-RX)/rows.length)/2,y:PT,
      width:(W-LX-RX)/rows.length,height:plot,class:'hit'});
    hit.addEventListener('mouseenter',()=>{
      svg.querySelectorAll('.rmark').forEach(n=>n.remove());
      svg.appendChild(sv('line',{x1:x(i),x2:x(i),y1:PT,y2:base,class:'rmark rule'}));
      svg.appendChild(sv('circle',{cx:x(i),cy:y(m.cumulative_t),r:5,class:'rmark dot'}));
      say(MONTHNAME(m.month)+': '+tn(m.room_t)+' of room that month, '+
          tn(m.cumulative_t)+' made in total by then'+
          (m.covers?'. That covers the order.'
                   :', still '+tn(m.still_short_t)+' short.'));
    });
    hit.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(hit);
    if(i%2===0){const tk=sv('text',{x:x(i),y:H-28,class:'tick'});
      tk.textContent=MONTHSHORT(m.month);svg.appendChild(tk);}
    if(m.month.slice(5)==='01'||i===0){
      const yr=sv('text',{x:x(i),y:H-14,class:'tick yr'});
      yr.textContent=m.month.slice(0,4);svg.appendChild(yr);}
  });

  // where the curve crosses, which is the date to quote
  if(r.ready){
    const i=rows.findIndex(m=>m.month===r.ready.month);
    if(i>=0){
      svg.appendChild(sv('line',{x1:x(i),x2:x(i),y1:y(r.tonnes),y2:base,class:'runhit'}));
      svg.appendChild(sv('circle',{cx:x(i),cy:y(r.tonnes),r:7,class:'runcross'}));
      const lab=sv('text',{x:x(i),y:base+16,class:'runcrosslab'});
      lab.textContent=MONTHSHORT(r.ready.month)+' '+r.ready.month.slice(2,4);
      svg.appendChild(lab);
    }
  }
  svg.addEventListener('mouseleave',()=>
    svg.querySelectorAll('.rmark').forEach(n=>n.remove()));
  box.appendChild(svg);
  return figure('How much could be made by when',box,
    r.ready
      ? 'The curve is everything the plant could have made by that month, added up. Where '+
        'it crosses the line is the earliest date worth quoting.'
      : 'The curve never reaches the line inside this window, so no date works on the '+
        'plant alone.');
}

/* ---- where a new order would go, against the room that is actually there. */
function fitChart(r){
  const rows=r.fill;
  const W=620,H=330,PT=30,PB=44,LX=54,GAP=7;
  const peak=niceTop(Math.max(1,...rows.map(x=>x.room_t)));
  const plot=H-PT-PB,bw=(W-LX-10)/rows.length,base=PT+plot;
  const hOf=v=>Math.max(0,v)/peak*plot;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart capchart'});
  gridY(svg,LX,W-6,PT,base,peak,4);
  rows.forEach((x,i)=>{
    const px=LX+i*bw+GAP/2,w=bw-GAP;
    const g=sv('g',{class:'cg'});
    g.appendChild(sv('rect',{x:px,y:base-hOf(x.room_t),width:w,
      height:Math.max(2,hOf(x.room_t)),rx:4,class:'cap'}));
    if(x.take_t>0)g.appendChild(sv('rect',{x:px,y:base-hOf(x.take_t),width:w,
      height:hOf(x.take_t),rx:3,class:'req'}));
    if(x.take_t>0&&hOf(x.take_t)>16){
      const lb=sv('text',{x:px+w/2,y:base-hOf(x.take_t)+14,class:'blab'});
      lb.setAttribute('fill','#fff');
      lb.textContent=IN(Math.round(x.take_t),0);
      g.appendChild(lb);
    }
    g.addEventListener('mouseenter',()=>say(
      MONTHNAME(x.month)+': '+(x.room_t<=0?'no room at all, it is already oversold.'
        :tn(x.room_t)+' of room, of which this order would take '+tn(x.take_t)+
         ' ('+Math.round(x.eats_pct)+'% of it), leaving '+tn(x.after_t)+'.')));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
    const tk=sv('text',{x:px+w/2,y:H-26,class:'tick'});
    tk.textContent=MONTHSHORT(x.month);
    svg.appendChild(tk);
  });
  box.appendChild(svg);
  const key=el('div','key');
  [['cap','room that month has'],['req','what this order would take']].forEach(([c,t])=>{
    const k=el('span','k ck '+c);k.appendChild(el('i'));
    k.appendChild(document.createTextNode(t));key.appendChild(k);});
  box.appendChild(key);
  return figure('Where the '+tn(r.tonnes)+' would come from',box,
    'Filled in order, month by month. A month whose bar is nearly all solid is giving up '+
    'everything it had.');
}

/* ---- the quote, built up. A stack rather than three peer bars, because a quote is not
   three independent quantities: it is a cost with a margin on top, and drawing the total
   next to its own components makes the same rupee appear twice. */
function quoteChart(r){
  const build=r.build||[];
  const W=560,rowH=46,PT=26,PB=20,LX=178,RX=104;
  const H=PT+rowH*build.length+PB;
  const peak=Math.max(...build.map(b=>b.value))||1;
  const wOf=v=>Math.max(3,(v/peak)*(W-LX-RX));
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart qchart'});
  let run=0;
  build.forEach((b,i)=>{
    const y=PT+i*rowH,bh=rowH-16;
    const total=!!b.total;
    // A component starts where the running total left off; a subtotal starts at the left
    // and shows the whole of what has accumulated. Resetting the accumulator on every
    // subtotal made the margin bar restart at the left edge, underneath the cost bar, so
    // nothing on screen showed that the quote is the cost plus the margin.
    const x0=total?LX:LX+wOf(run);
    const w=wOf(b.value);
    const g=sv('g',{class:'qb'+(total?' tot':'')+(b.label==='Quote'?' final':'')});
    g.appendChild(sv('rect',{x:x0,y:y,width:w,height:bh,rx:4}));
    const lab=sv('text',{x:LX-14,y:y+bh/2+5,class:'qlab'+(total?' tot':'')});
    lab.textContent=b.label;
    g.appendChild(lab);
    const val=sv('text',{x:x0+w+12,y:y+bh/2+5,class:'qval'+(total?' tot':'')});
    val.textContent='₹'+IN(Math.round(b.value),0);
    g.appendChild(val);
    g.addEventListener('mouseenter',()=>say(b.label+': '+rsFull(b.value)+' a tonne. '+b.note));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
    run=total?b.value:run+b.value;
  });
  box.appendChild(svg);
  const w=el('div');
  w.appendChild(figure('How the quote is built, per tonne',box,
    'Feedstock and conversion stack into the cost, and the margin you chose sits on top. '+
    'Everything is scaled to the '+IN(r.quoted_gcv,0)+' GCV you are quoting.'));
  if(r.window&&r.window.length>1)
    w.appendChild(spreadChart(r.window.map(x=>({label:x.month,value:x.cost_per_t,
      note:x.month+': feedstock at '+rs(x.feed_rate_per_t)+' a tonne makes a tonne of '+
           'product cost '+rs(x.cost_per_t)+'.'})),
      {title:'Cost to make a tonne, in each month of this window',
       format:v=>'₹'+IN(Math.round(v),0),
       note:'Shift the window and the quote moves with it. That is why the window is part '+
            'of the question.'}));
  return w;
}

/* ---- what was billed against what came in. */
function realisedChart(r){
  const net=r.billed-r.deducted;
  const box=el('div','svgbox');
  box.appendChild(splitBar('Of '+rs(r.billed)+' billed',[
    {label:'kept',value:net,color:'#1B4FD8'},
    {label:'lost to quality deductions',value:r.deducted,color:'#C8770B'}]));
  return figure('What was billed, and what survived the deductions',box,
    r.net_of_recoveries
      ? 'This tenant divides the kept figure by tonnes accepted, so the deductions are in '+
        'the price per tonne.'
      : 'This tenant divides the billed figure by tonnes dispatched, so the deductions are '+
        'reported but not taken off the price per tonne.');
}

/* ---- vendors we bought finished pellets from, by rate per unit of energy. */
function vendorRates(vendors,gcv){
  return spreadChart(vendors.map(v=>({label:v.vendor,value:v.cost_per_gcv,
    note:v.vendor+': '+tn(v.tonnes)+' across '+v.lots+' lots in '+v.months+
         ' months, at '+rs(v.rate_per_t)+' a tonne.'})),
    {title:'Every vendor we bought finished pellets from',
     format:v=>'\u20b9'+v.toFixed(2),
     note:'Priced per unit of energy at '+IN(gcv,0)+' GCV, so the rates are comparable.'});
}

/* ---- made here against bought in, in the same unit. */
function channelChart(r){
  const box=el('div','svgbox');
  const parts=[{label:'made here',value:r.made_here_t||0,color:'#1B4FD8'},
               {label:'bought in ready made',value:r.finished_t||0,color:'#0E7A5A'}];
  if(r.unknown_t>0)parts.push({label:'cannot tell',value:r.unknown_t,color:'#C8770B'});
  box.appendChild(splitBar('Tonnes of pellets',parts));
  return figure('Made here against bought in',box,
    'Both figures are tonnes of pellets. The residue bought is not shown here, because '+
    IN(r.feed_per_pellet||0,2)+' tonnes of residue makes one tonne of product and putting '+
    'the two side by side compares different things.');
}

/* ---- the two systems that should agree. */
function reconChart(r,ok){
  /* Drawn in tonnes, because the question is in tonnes. Titling this with a tonnage while
     the answer refused to give one was a panel arguing with itself, and splitting the bar
     by load count under a tonnage title invited the width to be read as the wrong thing. */
  const doubt=r.uninvoiced_t||0, conf=r.tonnes-doubt;
  const parts=[{label:'confirmed by both',value:conf,color:'#1B4FD8'}];
  if(doubt>0)parts.push(
    {label:'in the register, not in the books',value:doubt,color:'#C8770B'});
  const box=el('div','svgbox');
  box.appendChild(splitBar(ok?tn(r.tonnes)+' dispatched'
                             :'Somewhere between '+tn(conf)+' and '+tn(r.tonnes),parts));
  return figure('The register against the books',box,
    r.register_loads===r.book_vouchers
      ? 'The register counts '+plural(r.register_loads,'load')+' and the books '+
        plural(r.book_vouchers,'sales voucher')+'. They agree on the count.'
      : 'The register counts '+plural(r.register_loads,'load')+' and the books '+
        plural(r.book_vouchers,'sales voucher')+'. They do not agree, which is why the '+
        'figure above is a range.');
}

/* ---- one bar per live tender: how much is done, how much is left, and whether the
   months before the deadline hold enough room. Not a stack. A runway. */
function runwayChart(rows){
  const box=el('div','svgbox'),say=readout(box);
  const list=el('div','runway');
  const peak=Math.max(1,...rows.map(r=>Math.max(r.remaining_t,r.room_t)));
  rows.slice(0,10).forEach(r=>{
    const row=el('div','rw'+(r.fits?'':' bad'));
    const nm=el('div','rwn');
    nm.appendChild(el('b',null,r.plant));
    nm.appendChild(el('span',null,'by '+MONTHNAME(r.deadline)));
    const track=el('div','rwt');
    const room=el('i','room');room.style.width=(r.room_t/peak*100)+'%';
    const need=el('i','need');need.style.width=(r.remaining_t/peak*100)+'%';
    add(track,room,need);
    const val=el('div','rwv',r.fits?tn(r.remaining_t):tn(r.shortfall_t)+' short');
    add(row,nm,track,val);
    row.addEventListener('mouseenter',()=>say(
      r.plant+': '+tn(r.remaining_t)+' still owed by '+MONTHNAME(r.deadline)+
      ', and '+tn(r.room_t)+' of headroom between now and then across '+
      r.months_left+' months. That is '+tn(r.needed_per_month)+' a month.'));
    row.addEventListener('mouseleave',()=>say(''));
    list.appendChild(row);
  });
  box.appendChild(list);
  return figure('Every live tender against the months it has left',box,
    'The pale bar is the headroom before the deadline. The solid bar is what is still owed.');
}

/* ---- where each month sits between the cheapest and the dearest. A bar from zero is
   useless when the spread is seven percent: every bar looks the same and the answer is in
   the last few pixels. Here the axis is the spread itself. */
function spreadChart(rows,opt){
  opt=opt||{};
  // narrow viewBox, so scaling it to the column makes the type bigger rather
  // than smaller, and a row height that stays legible at three rows or twelve
  const W=470,rowH=Math.max(26,Math.min(38,300/Math.max(3,rows.length))),
        PT=30,PB=26,LX=118,RX=86;
  const H=PT+rowH*rows.length+PB;
  const vals=rows.map(r=>r.value);
  const lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*0.16||1;
  const a=lo-pad,b=hi+pad;
  const x=v=>LX+((v-a)/(b-a))*(W-LX-RX);
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart spread'});

  // the scale, labelled at the two ends and in the middle
  // label the real extremes, not the padded ends. The caption says the scale runs
  // from cheapest to dearest, and it should be telling the truth.
  [lo,(lo+hi)/2,hi].forEach((v,i)=>{
    svg.appendChild(sv('line',{x1:x(v),x2:x(v),y1:PT-10,y2:H-PB+4,class:'grid'}));
    const t=sv('text',{x:x(v),y:PT-16,class:'tick'});
    t.textContent=opt.format?opt.format(v):IN(v,2);
    svg.appendChild(t);
  });

  rows.forEach((r,i)=>{
    const y=PT+i*rowH+rowH/2;
    const best=r.value===lo,worst=r.value===hi;
    const g=sv('g',{class:'sp'+(best?' best':'')+(worst?' worst':'')});
    g.appendChild(sv('line',{x1:LX,x2:x(r.value),y1:y,y2:y,class:'stem'}));
    g.appendChild(sv('circle',{cx:x(r.value),cy:y,r:best||worst?8:6.5,class:'dot'}));
    const lb=sv('text',{x:LX-12,y:y+4,class:'slab'});
    lb.textContent=r.label;
    g.appendChild(lb);
    const vl=sv('text',{x:W-RX+12,y:y+4,class:'sval'});
    vl.textContent=opt.format?opt.format(r.value):IN(r.value,2);
    g.appendChild(vl);
    if(best||worst){
      const tag=sv('text',{x:x(r.value),y:y-13,class:'stag'});
      tag.textContent=best?'cheapest':'dearest';
      g.appendChild(tag);
    }
    if(r.note){
      g.addEventListener('mouseenter',()=>say(r.note));
      g.addEventListener('mouseleave',()=>say(''));
    }
    svg.appendChild(g);
  });
  box.appendChild(svg);
  return figure(opt.title||'Where each month sits',box,opt.note||
    'The scale runs from the cheapest month to the dearest, not from zero, because a seven '+
    'percent spread drawn from zero is twelve identical bars.');
}

/* ---- the decision in money. Two bars: what buying it in actually cost, and what making
   the same amount of energy would have cost. The gap between them is the answer, and it is
   the thing the rates per unit of energy were only ever a route to. */
function makeBuyMoney(r){
  const W=560,H=210,PT=40,LX=150,BH=42,GAP=26;
  const hi=Math.max(r.spent,r.would_have_cost_to_make)||1;
  const lo=Math.min(r.spent,r.would_have_cost_to_make);
  // The gap is the answer, and here it is four percent of either bar. Drawn from zero that
  // is fourteen pixels out of three hundred and forty, so the axis starts below the
  // smaller figure and says so instead of pretending to be zero.
  const base=Math.max(0,lo-(hi-lo)*1.6);
  const wOf=v=>Math.max(3,(v-base)/((hi-base)||1)*(W-LX-90));
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart mbmoney'});
  [['Bought it in',r.spent,'buy',0],
   ['Made it here',r.would_have_cost_to_make,'make',1]].forEach(([lab,v,cls,i])=>{
    const y=PT+i*(BH+GAP);
    const g=sv('g',{class:'mm'});
    g.appendChild(sv('rect',{x:LX,y:y,width:wOf(v),height:BH,rx:5,class:cls}));
    const l=sv('text',{x:LX-14,y:y+BH/2+5,class:'slab'});
    l.textContent=lab;
    g.appendChild(l);
    const t2=sv('text',{x:LX+wOf(v)+12,y:y+BH/2+5,class:'sval'});
    t2.textContent=rs(v);
    g.appendChild(t2);
    g.addEventListener('mouseenter',()=>say(lab+': '+rsFull(v)+
      (cls==='make'?'. That is what the same '+IN(Math.round(r.energy_gcal),0)+
       ' Gcal would have cost at this plant’s own costs, month by month.'
       :'. That is what actually left the bank for '+tn(r.tonnes)+'.')));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
  });
  const worse=r.extra_spent>0;
  const gl=sv('text',{x:LX+Math.max(wOf(r.spent),wOf(r.would_have_cost_to_make))/2,
    y:H-16,class:'gaplab '+(worse?'bad':'good')});
  gl.textContent=(worse?'buying cost ':'buying saved ')+rs(Math.abs(r.extra_spent))+
    (worse?' more':'');
  gl.setAttribute('text-anchor','middle');
  svg.appendChild(gl);
  const b0=sv('text',{x:LX,y:PT-16,class:'tick'});
  b0.setAttribute('text-anchor','start');
  b0.textContent='scale starts at '+rs(base)+', not zero';
  svg.appendChild(b0);
  box.appendChild(svg);
  return figure('What the decision was worth',box,
    'Both bars are the same amount of energy, because a bought-in tonne and one of yours '+
    'do not carry the same heat. The scale does not start at zero, or a four percent '+
    'difference would be invisible.');
}

/* ---- make against buy, which is one decision and so is one picture. Two dots a month,
   joined. The gap between them is the answer and the colour says which way it falls. */
function makeBuyChart(rows,opt){
  const months=[...new Set(rows.map(r=>r.mm))].sort();
  const W=470,rowH=Math.max(30,Math.min(46,320/Math.max(3,months.length))),
        PT=34,PB=26,LX=96,RX=96;
  const H=PT+rowH*months.length+PB;
  const all=[];
  rows.forEach(r=>{all.push(r.cost_per_gcv);if(r.make_per_gcv)all.push(r.make_per_gcv);});
  const lo=Math.min(...all),hi=Math.max(...all),pad=(hi-lo)*0.18||0.1;
  const a=lo-pad,b=hi+pad;
  const x=v=>LX+((v-a)/(b-a))*(W-LX-RX);
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart mbchart'});
  [a+pad,(a+b)/2,b-pad].forEach(v=>{
    svg.appendChild(sv('line',{x1:x(v),x2:x(v),y1:PT-12,y2:H-PB+4,class:'grid'}));
    const t=sv('text',{x:x(v),y:PT-18,class:'tick'});
    t.textContent='\u20b9'+v.toFixed(2);
    svg.appendChild(t);
  });
  months.forEach((mm,i)=>{
    const y=PT+i*rowH+rowH/2;
    const here=rows.filter(r=>r.mm===mm);
    const buy=here.reduce((s,r)=>s+r.cost_per_gcv*r.tonnes,0)/
              Math.max(1e-9,here.reduce((s,r)=>s+r.tonnes,0));
    const make=here[0].make_per_gcv;
    const cheaper=make!==null&&buy<make;
    const g=sv('g',{class:'mb'+(cheaper?' buywins':' makewins')});
    if(make!==null)g.appendChild(sv('line',{x1:x(make),x2:x(buy),y1:y,y2:y,class:'gap'}));
    if(make!==null)g.appendChild(sv('circle',{cx:x(make),cy:y,r:7.5,class:'make'}));
    g.appendChild(sv('circle',{cx:x(buy),cy:y,r:7.5,class:'buy'}));
    const lb=sv('text',{x:LX-12,y:y+4,class:'slab'});
    lb.textContent=MONS[+mm];
    g.appendChild(lb);
    const vl=sv('text',{x:W-RX+12,y:y+4,class:'sval '+(cheaper?'good':'bad')});
    vl.textContent=(make===null?'\u2014'
      :(cheaper?'\u2212':'+')+'\u20b9'+Math.abs(buy-make).toFixed(3));
    g.appendChild(vl);
    g.addEventListener('mouseenter',()=>say(
      MONS[+mm]+': buying in cost \u20b9'+buy.toFixed(3)+' a kilocalorie from '+
      here.map(r=>r.vendor).join(', ')+
      (make===null?'. No production figure for that month.'
       :'. Making it yourself cost \u20b9'+make.toFixed(3)+', so '+
         (cheaper?'buying was cheaper by \u20b9':'making was cheaper by \u20b9')+
         Math.abs(buy-make).toFixed(3)+' a kilocalorie.')));
    g.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(g);
  });
  box.appendChild(svg);
  const key=el('div','key');
  [['make','cost to make it here'],['buy','cost to buy it in']].forEach(([c,t])=>{
    const k=el('span','k mk '+c);k.appendChild(el('i'));
    k.appendChild(document.createTextNode(t));key.appendChild(k);});
  box.appendChild(key);
  return figure(opt&&opt.title||'Making it against buying it, per kilocalorie',box,
    'One row a month. The distance between the dots is what the decision is worth, and the '+
    'figure on the right is that gap in rupees per unit of GCV.');
}

/* ---- month by material, coloured by cost per kilocalorie. A grid rather than a bar
   chart, because the question is about a season and a choice at the same time: which
   material, and in which month, gives the cheapest heat. */
function heatGrid(cells){
  const mats=[...new Set(cells.map(c=>c.material))];
  const mms=['01','02','03','04','05','06','07','08','09','10','11','12']
    .filter(m=>cells.some(c=>c.mm===m));
  const costs=cells.map(c=>c.cost_per_gcv);
  const lo=Math.min(...costs),hi=Math.max(...costs);
  const CW=64,CH=48,LW=124,TH=28;
  const W=LW+CW*mms.length, H=TH+CH*mats.length+8;

  const box=el('div','svgbox'),say=readout(box);
  const scroll=el('div','hscroll');
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'heatsvg',width:W,height:H});

  mms.forEach((m,i)=>{
    const t=sv('text',{x:LW+i*CW+CW/2,y:17,class:'hlab'});
    t.textContent=MONSHORT[+m];
    svg.appendChild(t);
  });
  mats.forEach((mat,r)=>{
    const t=sv('text',{x:LW-12,y:TH+r*CH+CH/2+5,class:'hmat'});
    t.textContent=mat;
    svg.appendChild(t);
    mms.forEach((m,i)=>{
      const c=cells.find(x=>x.material===mat&&x.mm===m);
      const x=LW+i*CW+2,y=TH+r*CH+2,w=CW-4,h=CH-4;
      if(!c){
        svg.appendChild(sv('rect',{x:x,y:y,width:w,height:h,rx:5,class:'hnil'}));
        return;
      }
      const k=(c.cost_per_gcv-lo)/((hi-lo)||1);
      const g=sv('g',{class:'hcell'});
      // cheap is blue and good, dear is amber and bad. One axis, one meaning.
      g.appendChild(sv('rect',{x:x,y:y,width:w,height:h,rx:5,
        fill:k<0.5?'rgba(27,79,216,'+(0.62-k*0.86).toFixed(2)+')'
                  :'rgba(200,119,11,'+((k-0.5)*0.94+0.14).toFixed(2)+')'}));
      const lab=sv('text',{x:x+w/2,y:y+h/2+5,class:'hval'});
      lab.textContent=c.cost_per_gcv.toFixed(2);
      g.appendChild(lab);
      g.addEventListener('mouseenter',()=>say(
        mat+' in '+MONS[+m]+': \u20b9'+c.cost_per_gcv.toFixed(3)+' a kilocalorie. '+
        '\u20b9'+IN(Math.round(c.rate_per_t),0)+' a tonne at '+IN(c.gcv,0)+' GCV. '+
        'A normal year brings '+tn(c.tonnes)+', which is '+
        IN(Math.round(c.energy_gcal),0)+' Gcal of heat.'));
      svg.appendChild(g);
    });
  });
  scroll.appendChild(svg);
  box.appendChild(scroll);

  // a scale, so the colours mean something without hovering every cell
  const sc=el('div','hkey');
  sc.appendChild(el('span','hke','\u20b9'+lo.toFixed(2)+' cheapest'));
  const ramp=el('div','hramp');
  for(let i=0;i<=10;i++){
    const k=i/10,b=el('i');
    b.style.background=k<0.5?'rgba(27,79,216,'+(0.62-k*0.86).toFixed(2)+')'
                            :'rgba(200,119,11,'+((k-0.5)*0.94+0.14).toFixed(2)+')';
    ramp.appendChild(b);
  }
  sc.appendChild(ramp);
  sc.appendChild(el('span','hke','\u20b9'+hi.toFixed(2)+' dearest'));
  box.appendChild(sc);

  return figure('Cost per unit of GCV, by month and material',box,
    'Every purchase in the books, grouped by the calendar month it arrived in. A blank cell '+
    'means that material did not come to us in that month at all.');
}

/* ---- floor, likely and ceiling as a band. The gap is the answer. */
function bandChart(rows){
  const W=620,H=360,PT=26,PB=44,L=56;
  const hi=niceTop(Math.max(1,...rows.map(r=>r.ceiling_t)));
  const x=i=>L+i*((W-L-14)/Math.max(1,rows.length-1));
  const y=v=>PT+(H-PT-PB)*(1-v/hi);
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});
  gridY(svg,L,W-8,PT,H-PB,hi,4);
  const area=rows.map((r,i)=>x(i)+','+y(r.ceiling_t)).join(' ')+' '+
             rows.map((r,i)=>x(rows.length-1-i)+','+y(rows[rows.length-1-i].floor_t)).join(' ');
  svg.appendChild(sv('polygon',{points:area,class:'band'}));
  [['floor_t','fl'],['expected_t','ex'],['ceiling_t','ce']].forEach(([k,c])=>
    svg.appendChild(sv('polyline',{class:'ln '+c,
      points:rows.map((r,i)=>x(i)+','+y(r[k])).join(' ')})));
  rows.forEach((r,i)=>{
    const half=(W-L-14)/Math.max(1,rows.length-1)/2;
    const hit=sv('rect',{x:x(i)-half,y:PT,width:half*2,height:H-PT-PB,class:'hit'});
    hit.addEventListener('mouseenter',()=>{
      svg.querySelectorAll('.mark').forEach(n=>n.remove());
      [['floor_t','fl'],['expected_t','ex'],['ceiling_t','ce']].forEach(([k,c])=>
        svg.appendChild(sv('circle',{cx:x(i),cy:y(r[k]),r:4.5,class:'mark '+c})));
      svg.appendChild(sv('line',{x1:x(i),x2:x(i),y1:PT,y2:H-PB,class:'mark rule'}));
    });
    hit.addEventListener('mouseenter',()=>say(
      MONTHNAME(r.month)+': the plant makes '+tn(r.own_t)+', vendors have confirmed '+
      tn(r.firm_t)+', and a further '+tn(r.unconfirmed_t)+' is promised but unconfirmed. '+
      'Floor '+tn(r.floor_t)+', ceiling '+tn(r.ceiling_t)+'.'));
    hit.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(hit);
    svg.appendChild(Object.assign(sv('text',
      {x:x(i),y:H-22,class:'tick'}),{textContent:MONTHSHORT(r.month)}));
    if(r.month.slice(5)==='01'||i===0)svg.appendChild(Object.assign(sv('text',
      {x:x(i),y:H-8,class:'tick yr'}),{textContent:r.month.slice(0,4)}));
  });
  svg.addEventListener('mouseleave',()=>
    svg.querySelectorAll('.mark').forEach(n=>n.remove()));
  box.appendChild(svg);
  const key=el('div','key');
  [['fl','what you can count on'],['ex','what history says will land'],
   ['ce','if every promise holds']].forEach(([c,t])=>{
    const k=el('span','k '+c);k.appendChild(el('i'));k.appendChild(document.createTextNode(t));
    key.appendChild(k);});
  box.appendChild(key);
  return figure('Material you can count on, month by month',box,
    'Plan against the bottom line. Quote against the middle. Never against the top.');
}

/* ---- money arriving, as a calendar strip rather than a bar chart. */
function cashStrip(r){
  const box=el('div','svgbox'),say=readout(box);
  const strip=el('div','cash');
  const peakAll=Math.max(1,r.overdue_amount,...r.weeks.map(w=>w.amount));
  if(r.overdue_amount>1){
    const c=el('div','cw late');
    // usually the biggest number on the strip, and it had no bar, so the picture read
    // "nothing is coming" when the answer was "everything is already late"
    const lb=el('i');lb.style.height=(8+(r.overdue_amount/peakAll)*46)+'px';
    c.appendChild(lb);
    add(c,el('b',null,rs(r.overdue_amount)),el('span',null,'already late'));
    c.addEventListener('mouseenter',()=>say(
      rsFull(r.overdue_amount)+' across '+r.overdue_bills+' bills is past its due date. '+
      (r.overdue_by_buyer||[]).slice(0,3).map(b=>b.name+' '+rs(b.amount)).join(',  ')));
    c.addEventListener('mouseleave',()=>say(''));
    strip.appendChild(c);
  }
  r.weeks.forEach(w=>{
    const c=el('div','cw'+(w.amount>0?'':' nil'));
    const bar=el('i');bar.style.height=(8+(w.amount/peakAll)*46)+'px';
    c.appendChild(bar);
    c.appendChild(el('b',null,w.amount>0?rs(w.amount):'\u2014'));
    c.appendChild(el('span',null,MONTHSHORT(w.from)+' '+w.from.slice(8)));
    c.addEventListener('mouseenter',()=>say(
      'Week of '+w.from+': '+(w.amount>0
        ?rsFull(w.amount)+' from '+w.bills+' bills.  '+
         (w.by_buyer||[]).slice(0,3).map(b=>b.name+' '+rs(b.amount)).join(',  ')
        :'nothing falls due')));
    c.addEventListener('mouseleave',()=>say(''));
    strip.appendChild(c);
  });
  box.appendChild(strip);
  return figure('When the money is due',box,
    'Each bill sits in the week its own buyer\u2019s contract makes it due, not in one '+
    'house rule applied to everybody.');
}

/* ---- a month split into what is spoken for and what is not. */
function donut(parts,centre,sub){
  const R=64,C=2*Math.PI*R,W=180;
  const tot=parts.reduce((a,p)=>a+Math.max(0,p.value),0)||1;
  const box=el('div','svgbox'),say=readout(box);
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+W,class:'donut'});
  let off=0;
  parts.forEach(p=>{
    const frac=Math.max(0,p.value)/tot;
    const c=sv('circle',{cx:W/2,cy:W/2,r:R,fill:'none','stroke-width':22,
      stroke:p.color,'stroke-dasharray':(frac*C)+' '+C,
      'stroke-dashoffset':-off*C,transform:'rotate(-90 '+W/2+' '+W/2+')'});
    c.addEventListener('mouseenter',()=>say(p.label+': '+tn(p.value)+
      '  ('+Math.round(frac*100)+'% of what the plant can make)'));
    c.addEventListener('mouseleave',()=>say(''));
    svg.appendChild(c);off+=frac;
  });
  const t1=sv('text',{x:W/2,y:W/2-2,class:'dn'});t1.textContent=centre;
  const t2=sv('text',{x:W/2,y:W/2+18,class:'ds'});t2.textContent=sub;
  add(svg,t1,t2);box.appendChild(svg);
  const key=el('div','key');
  parts.forEach(p=>{const k=el('span','k');const i=el('i');i.style.background=p.color;
    k.appendChild(i);k.appendChild(document.createTextNode(p.label));key.appendChild(k);});
  box.appendChild(key);
  return box;
}

/* ---- who owes what, as blocks sized by the debt. */
function treemap(rows,label,value){
  const box=el('div','svgbox'),say=readout(box);
  const g=el('div','tree');
  const tot=rows.reduce((a,r)=>a+Number(r[value]||0),0)||1;
  rows.slice(0,12).forEach(r=>{
    const v=Number(r[value]||0),f=v/tot;
    const c=el('div','tc');
    c.style.flex=Math.max(0.06,f)+' 1 '+Math.max(80,f*520)+'px';
    c.style.background='rgba(27,79,216,'+(0.16+f*0.7).toFixed(2)+')';
    add(c,el('b',null,r[label]),el('span',null,rs(v)));
    c.addEventListener('mouseenter',()=>say(r[label]+' owes '+rsFull(v)+
      ', which is '+Math.round(f*100)+'% of everything outstanding.'));
    c.addEventListener('mouseleave',()=>say(''));
    g.appendChild(c);
  });
  box.appendChild(g);
  return box;
}

/* A round number to draw the top of the scale at, so the gridlines read as figures a
   person would say rather than whatever the maximum happened to be. */
function niceTop(v){
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}
/* Horizontal rules with their values on the left. Without these a chart is a shape, and a
   shape is not a measurement. */
function gridY(svg,x0,x1,y0,y1,top,steps){
  for(let i=0;i<=steps;i++){
    const v=top*i/steps, y=y1-(y1-y0)*(i/steps);
    svg.appendChild(sv('line',{x1:x0,x2:x1,y1:y,y2:y,class:'grid'}));
    const t=sv('text',{x:x0-9,y:y+4,class:'ytick'});
    t.textContent=v>=1e5?IN(v/1e5,1)+'L':v>=1000?IN(v/1000,0)+'k':IN(v,0);
    svg.appendChild(t);
  }
}

/* One load, two loads. Small, and the kind of small that makes somebody doubt the big
   numbers too. */
function plural(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}

const MONS=['','January','February','March','April','May','June','July','August',
            'September','October','November','December'];
const MONSHORT=MONS.map(m=>m.slice(0,3));
const MONTHNAME=m=>MONS[+String(m).slice(5,7)]+(String(m).length>6?' '+String(m).slice(0,4):'');
const MONTHSHORT=m=>MONS[+String(m).slice(5,7)].slice(0,3);

/* Which picture goes with which question.

   Three rules learned the hard way. Draw nothing rather than draw a chart the data cannot
   fill, because an axis reading Infinity is worse than a blank space. Never draw the
   comparison an answer has just refused to make. And check the array has rows in it, not
   just that the key exists, because an empty array is truthy in this language. */
function visualFor(a){
  const r=a.raw||{},m=a.metric,ok=a.verdict==='answered';
  const some=x=>Array.isArray(x)&&x.length>0;
  try{
    /* ---- the order book: how far along each contract is, and the wall of deadlines */
    if(m==='order_book'&&ok&&some(r.book)){
      const w=el('div');
      w.appendChild(bookChart(r.book));
      if(some(r.by_deadline))w.appendChild(deadlineChart(r.by_deadline));
      return w;
    }
    if(m==='open_commitment'&&r.contracted_t!==undefined){
      /* Awarded and the option clause are different promises, so they are drawn as
         different things. On one contract everything awarded had already gone out and the
         whole remainder was the option, and a bar that showed one "contracted" total made
         that look like a contract barely started. */
      const parts=[{label:'delivered',value:r.dispatched_t,color:'#1B4FD8'}];
      if(r.unattributed_t>0)parts.push(
        {label:'went out, not yet placed',value:r.unattributed_t,color:'#C8770B'});
      const left=Math.max(0,r.remaining_min_t);
      const awardedLeft=Math.max(0,Math.min(left,r.awarded_t-r.dispatched_t));
      if(awardedLeft>0)parts.push(
        {label:'still to deliver',value:awardedLeft,color:'#CFD9E8'});
      if(left-awardedLeft>0)parts.push(
        {label:'option the buyer may call',value:left-awardedLeft,color:'#E7EDF9'});
      return figure(
        tn(r.awarded_t)+' awarded'+(r.option_t>0?', plus '+tn(r.option_t)+' option':''),
        splitBar('',parts),
        r.unattributed_loads
          ? 'The amber went to this plant with no contract written against it. Until '+
            'somebody places it, the remainder is a range.'
          : (r.only_option_left
             ? 'Everything awarded has gone out. What is left is the option clause, which '+
               'the buyer may never call for.'
             : 'Every load to this plant is accounted for, so the remainder is exact.'));
    }

    /* ---- capacity */
    if(m==='capacity_free'&&ok&&some(r.months))
      return capacityChart(r.months);
    if(m==='month_pressure'&&ok&&r.capacity_t){
      const w=el('div');
      w.appendChild(monthSplit(r));
      if(some(r.movable)||some(r.pinned))
        w.appendChild(figure('What could move out of '+MONTHNAME(r.month),
          moveList(r.movable||[],r.pinned||[]),
          'A tender with months left before its deadline can be slowed down. One due this '+
          'month cannot, and neither can a draw a private buyer contracted for.'));
      return w;
    }
    if(m==='capacity_compare'&&ok&&r.a&&r.b)
      return compareChart(r);
    if(m==='delivery_runway'&&ok&&some(r.rows))
      return runwayChart(r);
    if(m==='fit_new_tender'&&ok&&some(r.fill))
      return fitChart(r);

    /* ---- what things cost */
    if(m==='material_by_month'&&ok&&some(r.cells))
      return heatGrid(r.cells);
    if(m==='material_cost_per_gcv'&&ok&&some(r.rows))
      return spreadChart(r.rows.map(x=>({label:x.material,value:x.cost_per_gcv,
        note:x.material+': '+rs(x.rate_per_t)+' a tonne at '+IN(x.gcv,0)+' GCV, across '+
             x.n+' purchases.'})),
        {title:'Cost per unit of GCV, by material',
         format:v=>'\u20b9'+v.toFixed(2),
         note:'A material can be cheaper per tonne and dearer per unit of energy. This is '+
              'the measure that decides what to buy.'});
    if(m==='production_cost'&&ok&&some(r.rows))
      return spreadChart(r.rows.map(x=>({label:x.month,value:x.cost_per_gcv,
        note:x.month+': feedstock at '+rs(x.feed_rate_per_t)+' a tonne, times '+
             r.feed_per_pellet+', plus '+rs(x.conversion_per_t)+' conversion, is '+
             rs(x.cost_per_t)+' a tonne. At '+IN(r.gcv_typical,0)+' GCV that is \u20b9'+
             x.cost_per_gcv.toFixed(3)+' per unit of GCV.'})),
        {title:'What a tonne of '+r.grade+' costs to make, month by month',
         format:v=>'\u20b9'+v.toFixed(2),
         note:'The scale runs cheapest to dearest rather than from zero, because a seven '+
              'percent spread drawn from zero is twelve identical bars.'});
    if(m==='buy_in_cost'&&ok&&some(r.rows)){
      const w=el('div');
      w.appendChild(makeBuyMoney(r));
      w.appendChild(makeBuyChart(r.rows,{title:'The same thing per unit of energy, by month'}));
      if(some(r.vendors))w.appendChild(vendorRates(r.vendors,r.gcv));
      return w;
    }
    if(m==='quote_for_tender'&&ok&&some(r.window))
      return quoteChart(r);

    /* ---- vendors and material coming in */
    if(m==='supply_outlook'&&ok&&some(r.months))
      return bandChart(r.months);
    if(m==='vendor_reliability'&&ok&&some(r.rows))
      return figure('Who keeps their word',vendorList(r.rows),
        'Only promises somebody has confirmed are counted.');

    /* ---- money */
    if(m==='realised_price'&&ok)
      return realisedChart(r);
    if(m==='outstanding'&&ok&&some(r.rows))
      return figure('Who is holding our money',treemap(r.rows,'party','outstanding'),
        'Widest block is the largest debt.');
    if(m==='cash_calendar'&&ok&&some(r.weeks))
      return cashStrip(r);

    /* ---- the reconciliations */
    if(m==='channel_split'&&ok)
      return channelChart(r);
    if(m==='dispatch_total'&&r.register_loads!==undefined)
      return reconChart(r,ok);
    /* Refusing to compare two periods and then drawing them side by side undoes the
       refusal. But when the comparison IS made, it is the whole point of the question and
       sixteen of the twenty four answers were showing nothing at all. */
    if(m==='item_period_comparison'&&ok&&r.earlier&&r.later)
      return figure(r.grade+' across the two years',
        splitBar('',[{label:r.earlier_fy,value:r.earlier.tonnes,color:'#9DB8F2'},
                     {label:r.later_fy,value:r.later.tonnes,color:'#1B4FD8'}]),
        'Earlier year first, whichever order you named them in.');
  }catch(e){
    // a blank column with no error in the log is how a renamed field survives
    // for weeks. Three of them did.
    console.error('chart failed for '+m, e);
  }
  return null;
}

const KW=/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|LEFT JOIN|JOIN|ON|AND|OR|SUM|COUNT|COALESCE|LIMIT|AS|FILTER|LATERAL|BETWEEN|NOT|WITH|CASE|WHEN|THEN|ELSE|END|GREATEST|NULLIF|EXTRACT|INTERVAL|DISTINCT)\b/g;

/* The right-hand panel. The person on the left gets an answer; the evaluator gets the
   queries that produced it and the settings they were built with. */
function sqlPanel(a){
  const box=el('div','right'),h=el('div','rh');
  add(h,el('span',null,'What actually ran'),el('b',null,(a.sql||[]).length+' queries'));
  box.appendChild(h);
  const w=el('div','sqlwrap');
  (a.sql||[]).forEach(function(q,i){
    const ps=Object.entries(q.params||{});
    w.appendChild(el('p','cap','query '+(i+1)+(ps.length?'     '+ps.map(function(kv){
      return kv[0]+' = '+kv[1];}).join(',  '):'')));
    const pre=el('pre');
    pre.innerHTML=q.sql.replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(KW,function(m){return '<span class="kw">'+m+'</span>';})
      .replace(/%\((\w+)\)s/g,'<span class="pm">:$1</span>');
    w.appendChild(pre);
  });
  if(!(a.sql||[]).length)
    w.appendChild(el('pre',null,'No query ran. This one is refused before it reaches the database.'));
  box.appendChild(w);
  const du=a.definitions_used||{};
  if(Object.keys(du).length){
    const d=el('div','defbox');
    Object.entries(du).forEach(function(e){
      const word=e[0],info=e[1],line=el('div','dl');
      line.appendChild(document.createTextNode(word+' = '));
      line.appendChild(el('b',null,Object.entries(info.params||{})
        .map(function(kv){return kv[0]+': '+kv[1];}).join(',  ')));
      line.appendChild(document.createTextNode('    set '+info.since));
      d.appendChild(line);
    });
    box.appendChild(d);
  }
  return box;
}

function answerCard(a){
  const w=a.verdict==='withheld';
  const c=el('div','ans '+(w?'w':'a'));
  const top=el('div','vtop');
  top.appendChild(el('span','badge',w?'withheld':'answered'));
  if(a.reason)top.appendChild(el('span','rs',a.reason));
  if(a.gate_failed)top.appendChild(el('span','rs','gate stopped it: '+a.gate_failed));
  c.appendChild(top);
  const grid=el('div','split2'),left=el('div','left');
  const ls=el('div','lsplit'),words=el('div','lwords'),vcol=el('div','lvis');
  if(a.head){
    /* A figure gets the display treatment. A phrase does not, because set at that size it
       fills the column and pushes the answer out of the way. */
    /* A figure gets the display size. A phrase does not. And either way, a headline that
       wraps onto three lines has stopped being a headline, so the size steps down as the
       text gets longer rather than letting it break wherever it likes. */
    const isFig=/\d/.test(a.head),len=a.head.length;
    const size=len>22?' xs':len>16?' sm':len>12?' md':'';
    words.appendChild(el('div','headnum'+(isFig?'':' word')+size,a.head));
  }
  if(a.sub)words.appendChild(el('p','headsub',a.sub));
  words.appendChild(el('p','detail',a.text));
  const wk=workingPanel(a);if(wk)words.appendChild(wk);
  const vis=visualFor(a);
  if(vis)vcol.appendChild(vis);
  if(a.rows&&a.rows.length)
    vcol.appendChild(dataTable(a.rows.slice(0,14),'The rows behind it'));
  add(ls,words,vcol);
  left.appendChild(ls);
  grid.appendChild(left);grid.appendChild(sqlPanel(a));
  c.appendChild(grid);
  if(a.fix)c.appendChild(el('p','fix','\u2192 '+a.fix));
  const rq=el('div');c.appendChild(rq);resolveHere(a,rq,()=>rerun(a,c));
  const nx=followUps(a);if(nx)c.appendChild(nx);
  const pv=el('div','prov');
  pv.appendChild(el('span',null,'metric '+a.metric));
  pv.appendChild(el('span',null,Object.keys(a.numbers||{}).length+' figures, every one from a query above'));
  c.appendChild(pv);
  return c;
}
/* Telling somebody a number is being held back because a load has not been placed, and
   then making him go and find another screen to place it, is most of the way to him not
   bothering. The questions that are blocking this answer are put underneath it, with the
   possible answers as buttons. Answer one and the number recomputes in place. */
async function resolveHere(a,host,after){
  const r=a.raw||{};
  const blocked=(r.blocked_rows||[]).map(x=>x.dispatch_no);
  const wants=blocked.length||r.unattributed_loads;
  if(a.verdict!=='withheld'||!wants)return;
  let d;try{d=await api('/api/review?tenant='+S.tenant);}catch(e){return;}
  let items=(d.items||[]).filter(i=>i.kind==='dispatch_tender');
  if(blocked.length)items=items.filter(i=>blocked.indexOf(i.subject_ref)>=0);
  if(!items.length)return;
  const box=el('div','inq');
  const h=el('div','inqh');
  add(h,el('b',null,items.length===1?'One question is holding this number back'
                                    :items.length+' questions are holding this number back'),
        el('span',null,'Answer one and the figure below recomputes. A load placed on a '
          + 'contract that is still open moves the total; one placed on a contract that has '
          + 'closed narrows the range without moving the ceiling, because nothing is still '
          + 'owed on it.'));
  box.appendChild(h);
  items.slice(0,6).forEach(it=>{
    const pr=it.proposal||{},row=el('div','inqr');
    const q=el('div','inqq');
    q.appendChild(el('b',null,pr.question||'which contract was this load against?'));
    const bits=[];
    if(pr.tonnes!==undefined)bits.push(fmt(pr.tonnes)+' t');
    if(pr.date)bits.push('sent '+pr.date);
    if(pr.plant)bits.push('to '+pr.plant);
    q.appendChild(el('span',null,bits.join('   \u00b7   ')));
    row.appendChild(q);
    const opts=el('div','inqo');
    (pr.options&&pr.options.length?pr.options:['cannot be placed']).forEach(o=>{
      const nice=(pr.labels&&pr.labels[o])||o;
      const b=el('button','inqb',nice);
      b.onclick=async()=>{
        b.disabled=true;b.textContent='saving\u2026';
        try{
          await post('/api/review/resolve',{tenant:S.tenant,review_id:it.review_id,choice:o});
          S.answers={};await loadSummary();drawTabs();
          toast('Placed against '+nice+'. Recomputing.');
          after();
        }catch(e){b.disabled=false;b.textContent=nice;toast(e.message);}
      };
      opts.appendChild(b);
    });
    row.appendChild(opts);
    box.appendChild(row);
  });
  if(items.length>6)box.appendChild(el('p','inqm',
    'and '+(items.length-6)+' more on the review queue.'));
  host.appendChild(box);
}

/* Re-ask the same question with the same parameters and swap the card in place, so the
   owner watches the range close rather than being sent back to the top of the page. */
async function rerun(a,card){
  try{
    const fresh=await post('/api/ask',
      {tenant:S.tenant,metric:a.metric,params:a.params||{}});
    const next=answerCard(fresh);
    next.classList.add('flash');
    card.replaceWith(next);
  }catch(e){toast(e.message);}
}

/* The conversation an owner actually has. He sees a headroom figure and immediately wants
   to know which month is tight, and then what he can move. Rather than making him find the
   next question in a list of twenty, the metric declares what usually comes next and the
   card offers it as one click, with the parameters it can carry over already filled. */
function followUps(a){
  const spec=(S.metrics||[]).find(m=>m.name===a.metric);
  if(!spec||!spec.follows||!spec.follows.length)return null;
  const wrap=el('div','nextwrap');
  const box=el('div','next');
  box.appendChild(el('span','nl','What I would ask next'));
  const host=el('div','chainhost');
  spec.follows.forEach(name=>{
    const m=(S.metrics||[]).find(x=>x.name===name);if(!m)return;
    const b=el('button','chip',m.title);
    b.onclick=()=>askFollow(m,a,host,b);
    box.appendChild(b);
  });
  add(wrap,box,host);
  return wrap;
}

/* Carry over whatever the previous answer already settled, then let the owner fill the
   rest in the sentence. A follow-up is still a metric plus typed parameters. There is no
   free text anywhere on this path. */
function carryOver(m,a){
  const p={},r=a.raw||{},prev=a.params||{};
  (m.params||[]).forEach(spec=>{
    const k=spec.key;
    // whatever the user already chose travels first
    if(prev[k]!==undefined&&prev[k]!==null){p[k]=prev[k];return;}
    let v;
    switch(k){
      case 'month':
        // the month worth asking about is the one that is in trouble, then the tightest
        v=(r.oversold_months&&r.oversold_months[0]&&r.oversold_months[0].month)
          ||r.worst||r.month
          ||(r.fill&&r.fill[0]&&r.fill[0].month);
        break;
      case 'by_month':
        // the deadline the quote was priced against, if we came from one. Otherwise the
        // first month with real room, and never the deadline of a tender that already does
        // not close: seeding the worst possible month is worse than seeding nothing.
        v=r.to||r.by_month||r.first_free
          ||(r.free_months&&r.free_months[0]&&r.free_months[0].month);
        break;
      case 'deliver_from':
        v=(r.fill&&r.fill.find(f=>f.take_t>0)||{}).month||r.first_free||r.from;
        break;
      case 'deliver_to':
        v=r.by_month||r.to
          ||((r.fill||[]).filter(f=>f.take_t>0).slice(-1)[0]||{}).month;
        break;
      case 'month_a': v=r.worst||(r.months&&r.months[0]&&r.months[0].month); break;
      case 'month_b': v=r.first_free
          ||(r.months&&r.months[r.months.length-1]&&r.months[r.months.length-1].month);
        break;
      case 'tender_ref':
        // the contract the answer was actually about, or the one with most left on it
        v=r.contract||r.tender_ref
          ||(r.book&&r.book[0]&&r.book[0].tender_ref)
          ||(r.runway&&r.runway[0]&&r.runway[0].tender_ref);
        break;
      case 'plant':
        v=r.plant||(r.book&&r.book[0]&&r.book[0].plant)
          ||(r.runway&&r.runway[0]&&r.runway[0].plant);
        break;
      case 'grade_code':
        v=r.grade||r.grade_code
          ||(r.book&&r.book[0]&&r.book[0].grade_code);
        break;
      case 'fy':
        v=r.fy||prev.fy_b||prev.fy_a;
        break;
      case 'vendor':
        v=(r.vendors&&r.vendors[0]&&(r.vendors[0].vendor))||r.vendor;
        break;
      case 'tonnes':
        v=r.shortfall_t>0?Math.round(r.shortfall_t):undefined;
        break;
      default: v=undefined;
    }
    if(v!==undefined&&v!==null)p[k]=v;   // never write an explicit undefined
  });
  return p;
}

function askFollow(m,from,host,btn){
  const open=host.querySelector('.chain[data-m="'+m.name+'"]');
  if(open){open.remove();btn.classList.remove('on');return;}
  host.querySelectorAll('.chain').forEach(n=>n.remove());
  host.parentNode.querySelectorAll('.chip.on').forEach(n=>n.classList.remove('on'));
  btn.classList.add('on');
  const q={id:'\u21b3',ask:m.title,metric:m.name,
           params:carryOver(m,from),why:m.about,followup:true};
  const box=el('div','chain');box.setAttribute('data-m',m.name);
  box.appendChild(questionCard(q,-1));
  host.appendChild(box);
  requestAnimationFrame(()=>{
    const b=box.querySelector('button.run');if(b)b.click();
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

/* Column names in a product are read by somebody who has never seen the schema, so
   scheduled_t becomes "contracted this month" and the tonnages line up on the decimal. */

// the figure is rather than what the code calls it. The two that matter most:
// "owed to private buyers this month" is a promise about that month specifically, and
// "needed to stay on tender deadlines" is not a promise at all, it is the pace.

  scheduled_t:'Owed to private buyers this month',

  awarded_t:'Awarded',delivered_t:'Delivered',done_pct:'Done',
  suggested_t:'Suggested draw',oversold_t:'',
  tender_ref:'Contract',plant:'Buyer',grade_code:'Product',tonnes:'Tonnes',
  remaining_t:'Still owed',room_t:'Headroom to deadline',shortfall_t:'Short by',
  deadline:'Due by',months_left:'Months left',needed_per_month:'Needed a month',
  delivered:'Delivered',out_t:'Dispatched',cost_per_t:'Cost a tonne',
  cost_per_gcv:'Cost per GCV',feed_rate_per_t:'Feedstock a tonne',
  conversion_per_t:'Conversion a tonne',feed_cost_per_t:'Feedstock in a tonne',
  own_t:'We make',firm_t:'Vendors confirmed',unconfirmed_t:'Promised, unconfirmed',
  floor_t:'Floor',ceiling_t:'Ceiling',expected_t:'Likely',material:'Material',
  energy_gcal:'Energy, Gcal',rate_per_t:'Rate a tonne',gcv:'GCV',amount:'Amount',
