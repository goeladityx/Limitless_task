                    'oversold_t','suggested_t']);
const MONEYCOL=/(cost|rate|amount|outstanding|price|per_t$)/;

/* How the rows became the number. Not the query, which is on the right, but the arithmetic
   after it: each step, what it came to, and which two figures it came from. This is the
   thing a second pair of eyes checks, and the thing a customer asks about six months on. */
/* When a metric has not declared its steps, the panel falls back to the figures the query
   returned. Those keys are written for the code, so they get names here, and a panel that
   would be nothing but zeros is not shown at all: a grid of noughts under a refusal tells
   nobody anything and it looks like a bug. */
const NUMNAME={per_t:'Received per tonne',per_tonne:'Received per tonne',billed:'Billed',
  ded:'Quality deductions',deducted:'Quality deductions',inv:'Sales vouchers',
  invoices:'Sales vouchers',t:'Tonnes',tonnes:'Tonnes',net:'Money actually due',
  total:'Total',total_free_t:'Room to sell',pool:'Still owed on tenders',
  committed_t:'Still owed',awarded_t:'Awarded',delivered_t:'Delivered',
  cap:'Plant can make',sched:'Owed to private buyers',req:'Tender pace needed',
  free:'Room to sell',over:'Oversold by',used:'Capacity used',movable:'Could move',
  pinned:'Cannot move',want:'Order asked for',short:'Short by',spare:'Left over',
  n_free:'Months with room',n_over:'Months oversold',n_tight:'Months full',
  n_months:'Months looked at',quote_per_t:'Quote per tonne',cost_per_t:'Cost per tonne',
  margin:'Margin asked for',overdue:'Already overdue',window:'Due in the window',
  soon:'Next money in',floor:'Floor',ceiling:'Ceiling',firm:'Confirmed by vendors',
  unconfirmed:'Promised, unconfirmed',n_years:'Years with trade',best_t:'Biggest year',best:'Best year we ever bought',months:'Months we have traded with him',contracted_t:'Contracted',dispatched_t:'Already delivered',loads:'Loads',option_applied:'Option clause counted',remaining_min_t:'Least that could be left',remaining_max_t:'Most that could be left',unattributed_loads:'Loads with no contract against them',unattributed_t:'Tonnage with no contract against it',extracted:'Promises read out of email',feed:'Raw material bought',fin:'Finished pellets bought in',unk:'Could not be told apart',unk_n:'Purchases that could not be told apart',lo:'Lower bound',hi:'Upper bound',product:'What the product actually tests at',quoted:'The GCV you asked to quote',};

function workingPanel(a){
  const w=a.working||[];
  const figs=Object.entries(a.numbers||{})
    .filter(([k,v])=>typeof v==='number'&&v!==0);
  const named=figs.filter(([k])=>NUMNAME[k]);
  if(!w.length&&!named.length)return null;    // nothing we can explain, so say nothing
  const box=el('div','work');
  const h=el('button','workh');
  const cnt=w.length||named.length;
  h.appendChild(el('span','wt','How this number was reached'));
  h.appendChild(el('span','wc',cnt+' steps'));
  const body=el('div','workb');
  box.appendChild(h);box.appendChild(body);
  let open=true;
  h.onclick=()=>{open=!open;body.hidden=!open;h.classList.toggle('shut',!open);};

  if(w.length){
    const ol=el('ol','wsteps');
    w.forEach(stp=>{
      const li=el('li');
      const top=el('div','wline');
      top.appendChild(el('span','wlab',stp.step));
      const v=Number(stp.value);
      const u=(stp.unit||'').toLowerCase();
      const shown=!isFinite(v)?String(stp.value)
        :u.indexOf('per gcv')>=0?v.toFixed(3)
        :u.indexOf('rupee')>=0?rs(v)
        :u.indexOf('tonne')>=0?IN(v,Math.abs(v)<100?1:0)
        :IN(v,Number.isInteger(v)?0:2);
      const val=el('span','wval',shown);
      if(stp.unit&&u.indexOf('rupee')<0)val.appendChild(el('i',null,' '+stp.unit));
      top.appendChild(val);
      li.appendChild(top);
      if(stp.detail)li.appendChild(el('p','wdet',stp.detail));
      ol.appendChild(li);
    });
    body.appendChild(ol);
    body.appendChild(el('p','wfoot',
      'Every figure above came out of a query on the right. None of it was written by hand.'));
  }else{
    // no declared derivation, so show the figures themselves. Still a trail.
    const g=el('div','wnums');
    /* Only figures we can name in English. A panel headed "How this number was reached"
       that answers "unk 538.4" is worse than one that says nothing: it looks like the
       trail is there when the reader cannot follow a step of it. app/audit.py fails the
       build if a figure ever reaches this panel without a label. */
    figs.filter(([k])=>NUMNAME[k]).slice(0,24).forEach(([k,v])=>{
      const c=el('div','wn');
      c.appendChild(el('b',null,IN(v,Number.isInteger(v)?0:2)));
      c.appendChild(el('span',null,NUMNAME[k]));
      g.appendChild(c);
    });
    body.appendChild(g);
    body.appendChild(el('p','wfoot',
      'Each of these came back from a query on the right, and the reply is checked against '+
      'them before it is sent.'));
  }
  return box;
}

function dataTable(rows,cap){
  if(!rows||!rows.length)return el('div','empty','Nothing to show.');
  const cols=Object.keys(rows[0]).filter(c=>!HIDE.has(c)&&COLNAME[c]!=='');
  const box=el('div','tbl');
  if(cap)box.appendChild(el('div','tcap',cap));
  const sc=el('div','scroll'),t=el('table'),thead=el('thead'),htr=el('tr');
  cols.forEach(c=>{
    const th=el('th',typeof rows[0][c]==='number'?'num':null,
                COLNAME[c]||c.replace(/_t$/,'').replace(/_/g,' '));
    htr.appendChild(th);});
  thead.appendChild(htr);t.appendChild(thead);
  const tb=el('tbody');
  rows.forEach(r=>{const tr=el('tr');
    cols.forEach(c=>{
      const v=r[c];
      if(v===null||v===undefined){tr.appendChild(el('td','nil','not recorded'));return;}
      if(typeof v==='number'){
        const txt=MONEYCOL.test(c)?(Math.abs(v)<10?v.toFixed(3):rs(v))
                 :Math.abs(v)<10&&!Number.isInteger(v)?v.toFixed(2):IN(v,v<100?1:0);
        const td=el('td','num'+(v<0?' neg':''),txt);
        tr.appendChild(td);return;
      }
      tr.appendChild(el('td',null,/^\d{4}-\d{2}$/.test(v)
        ?MONTHSHORT(v)+' '+v.slice(0,4):String(v)));
    });
    tb.appendChild(tr);});
  t.appendChild(tb);sc.appendChild(t);box.appendChild(sc);return box;
}

/* ---------------------------------------------------------------- ask page */
/* The five questions the story leaves you holding.

   Each one runs for real against the database, in order, and the answer to one is the
   reason for the next. The parameters are not typed in: they come from what the previous
   step found, which is also how the owner would actually arrive at them. */
const STORY=[
  {n:'1', beat:'He opens the file.',
   ask:'So what have I already agreed to deliver?',
   metric:'order_book', params:{},
   after:'It will not give him a number. Four loads left the yard with nothing written '+
         'against them, so the honest answer is a ceiling.'},

  {n:'2', beat:'A ceiling is not a plan.',
   ask:'Then when have I actually got room?',
   metric:'capacity_free', params:{months:12},
   after:'September is already oversold. The six months after it are full to within three '+
         'percent. Nothing on his desk told him that.'},

  {n:'3', beat:'Now the tender on the desk.',
   ask:'It is 3,000 t. By when could I have it made?',
   metric:'delivery_runway', params:{tonnes:3000},
   after:'April, eight months out. The curve is what he quotes a date off, and it is his '+
         'plant alone. Anything bought in pulls it forward.'},

  {n:'4', beat:'So what can he buy in?',
   ask:'How much material can I count on?',
   metric:'supply_outlook', params:{months:12},
   after:'Nothing. Not one vendor has promised him anything for a year. The promises exist, '+
         'in fifteen hundred emails nobody has read back to him.'},

  {n:'5', beat:'Which leaves the bid.',
   ask:'And if I do bid, what do I quote?',
   metric:'quote_for_tender',
   params:{grade_code:'PLT-A1',quoted_gcv:3200,margin_per_gcv:0.3,
           deliver_from:'2026-10',deliver_to:'2027-03'},
   after:'Feedstock in each of those months, times the conversion ratio, plus conversion, '+
         'divided by the energy in a tonne. Every step on screen. Change the margin and '+
         'watch it move.'},
];

function pageStory(v){
  const intro=el('div','sintro');
  add(intro,
      el('p','skicker','You have just watched a tender land on a man\u2019s desk'),
      el('h2',null,'Five questions he cannot answer'),
      el('p','slede','Every sentence below is editable and every answer is live, straight '+
        'out of his books. Nothing here is a screenshot.'));
  v.appendChild(intro);

  const thread=el('div','thread');
  STORY.forEach((step,i)=>{
    const node=el('div','sstep');

    const beat=el('div','sbeat');
    beat.appendChild(el('span','sn',step.n));
    beat.appendChild(el('span','sbt',step.beat));
    node.appendChild(beat);
    node.appendChild(el('div','sq',step.ask));

    const q={id:'S'+(i+1),ask:step.ask,metric:step.metric,
             params:Object.assign({},step.params),why:null,followup:true};
    const card=questionCard(q,-1);
    card.classList.add('scard');
    node.appendChild(card);

    const after=el('p','safter',step.after);
    node.appendChild(after);
    thread.appendChild(node);

    // the answer arrives rather than being there already, which is most of what makes a
    // sequence of cards feel like a sequence of moments
    setTimeout(()=>{
      const b=card.querySelector('button.run');
      if(b)b.click();
    },i*260);
  });
  v.appendChild(thread);

  // the line fills as each beat comes into view, so the page has a direction
  const seen=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting)e.target.classList.add('lit');
  }),{rootMargin:'-15% 0px -55% 0px'});
  thread.querySelectorAll('.sstep').forEach(n=>seen.observe(n));

  const end=el('div','send');
  add(end,el('h3',null,'That is the whole argument.'),
      el('p',null,'Two answers, two refusals and a calculation you can follow. Twenty '+
        'three more questions next door, all behaving the same way: they answer, or they '+
        'tell you exactly what is stopping them.'));
  const go=el('button','cta','Ask the rest');
  go.onclick=()=>{S.page='ask';drawTabs();draw();window.scrollTo(0,0);};
  end.appendChild(go);
  v.appendChild(end);
}

function pageAsk(v){
  add(v,el('h2',null,'Ask'),
        el('p','lede','Every question is a sentence with the choices inside it. Change a dropdown and it becomes your own question. Nothing you pick here turns into SQL: it selects a calculation and its settings, and the values on offer come out of this company’s own data.'));
  statStrip(v);
  S.questions.forEach((q,i)=>v.appendChild(questionCard(q,i)));
}

function questionCard(q,i){
  const card=el('div','qcard');
  const head=el('div','qhead');
  head.appendChild(el('span','qtag',q.id));
  const sen=el('div','sentence');
  const params={...q.params};
  const tpl=SENT[q.metric]||[q.ask];
  tpl.forEach(bit=>{
    if(typeof bit==='string'){sen.appendChild(document.createTextNode(bit));return;}
    if(typeof bit==='function'){sen.appendChild(document.createTextNode(bit()));return;}
    const key=bit.p,kind=KIND[key]||'int';
    if(kind==='int'||kind==='float'){
      const inp=el('input');inp.type='number';inp.step=kind==='float'?'0.05':'1';
      // Showing a default in the box is not the same as having chosen it. Seed the
      // parameter with what is on screen, or the request goes out without it and the
      // metric is asked to work with nothing.
      const start=params[key]??DEFAULTV[key]??0;
      params[key]=kind==='float'?parseFloat(start):parseInt(start);
      inp.value=start;
      inp.oninput=()=>params[key]=kind==='float'?parseFloat(inp.value):parseInt(inp.value);
      sen.appendChild(inp);
    }else{
      const wrap=el('span','wrapsel'),sel=el('select');
      (S.options[kind]||[]).forEach(o=>{
        const val=typeof o==='object'?o.value:o, lab=typeof o==='object'?o.label:o;
        const op=el('option',null,lab);op.value=val;sel.appendChild(op);});
      if(params[key])sel.value=params[key];
      params[key]=sel.value;          // whatever is showing is what will be asked
      sel.onchange=()=>{params[key]=sel.value;};
      wrap.appendChild(sel);sen.appendChild(wrap);
    }
  });
  head.appendChild(sen);
  const run=el('button','run','Run');
  head.appendChild(run);
  card.appendChild(head);
  if(q.why)card.appendChild(el('p','why',q.why));
  const slot=el('div');card.appendChild(slot);
  if(!q.followup&&S.answers[q.id])slot.appendChild(answerCard(S.answers[q.id]));
  run.onclick=async()=>{
    run.classList.add('busy');run.textContent='...';
    try{
      const a=await post('/api/ask',{tenant:S.tenant,metric:q.metric,params});
      if(!q.followup)S.answers[q.id]=a;
      slot.innerHTML='';slot.appendChild(answerCard(a));
    }catch(e){slot.innerHTML='';slot.appendChild(el('div','body','Could not run that: '+e.message));}
    run.classList.remove('busy');run.textContent='Run';
  };
  return card;
}

function statStrip(v){
  const q=S.summary,g=el('div','stats');
  const one=(n,l,flag)=>{const d=el('div','stat'+(flag?' flag':''));
    d.appendChild(el('b',null,fmt(n)));d.appendChild(el('span',null,l));g.appendChild(d);};
  one(q.live_contracts,'live contracts');
  one(q.loads,'loads dispatched');
  one(Math.round(q.tonnes),'tonnes shipped');
  one(q.untagged,'loads with no contract on them',q.untagged>0);
  one(q.open_reviews,'waiting on a person',q.open_reviews>0);
  v.appendChild(g);
}

/* ---------------------------------------------------------------- review */
async function pageReview(v){
  add(v,el('h2',null,'Review queue'),
        el('p','lede','Everything the system would not guess at, as a specific question with the possible answers beside it. Answer one and the numbers that depended on it change.'));
  let d;
  try{d=await api('/api/review?tenant='+S.tenant);}
  catch(e){v.appendChild(el('div','empty',e.message));return;}
  if(!d.items.length){v.appendChild(el('div','empty','Nothing waiting. Every load and every purchase is accounted for.'));return;}
  const kinds=[...new Set(d.items.map(i=>i.kind))];let active=kinds[0];
  const chips=el('div','chips'),body=el('div');
  const render=()=>{
    body.innerHTML='';
    d.items.filter(i=>i.kind===active).slice(0,40).forEach(it=>{
      const p=it.proposal||{},pan=el('div','panel'),h=el('div','ph');
      h.appendChild(el('span','ref',it.subject_ref));
      h.appendChild(el('span','qn',p.question||it.kind.replace(/_/g,' ')));
      pan.appendChild(h);
      const bits=[];
      if(p.date)bits.push(p.date);
      if(p.tonnes!==undefined)bits.push(fmt(p.tonnes)+' t');
      if(p.plant)bits.push(p.plant);
      if(p.vendor)bits.push(p.vendor);
      if(p.rate!==undefined)bits.push('Rs '+fmt(p.rate)+'/t');
      if(p.item)bits.push(p.item);
      if(bits.length)pan.appendChild(el('div','meta',bits.join('   ·   ')));
      const opts=el('div','opts');
      (p.options&&p.options.length?p.options:['cannot be placed']).forEach(o=>{
        const nice=(p.labels&&p.labels[o])||o;
        const b=el('button','opt',nice);
        b.onclick=async()=>{
          try{await post('/api/review/resolve',{tenant:S.tenant,review_id:it.review_id,choice:o});
            toast('Saved. That load now counts against '+((p.labels&&p.labels[o])||o));
            S.answers={};await loadSummary();draw();}
          catch(e){toast(e.message);}
        };
        opts.appendChild(b);});
      pan.appendChild(opts);body.appendChild(pan);
    });
  };
  kinds.forEach(k=>{
    const b=el('button','qchip',k.replace(/_/g,' ')+'  '+d.counts[k]);
    b.setAttribute('aria-pressed',String(k===active));
    b.onclick=()=>{active=k;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));render();};
    chips.appendChild(b);});
  add(v,chips,body);render();
}

/* ---------------------------------------------------------------- data */
async function pageData(v){
  add(v,el('h2',null,'The data'),
        el('p','lede','Exactly what came out of the company’s systems, untouched. Dates are still text, quantities are still in quintals, party names are still as somebody typed them.'));
  let tables;
  try{tables=await api('/api/tables?tenant='+S.tenant);}
  catch(e){v.appendChild(el('div','empty',e.message));return;}
  const chips=el('div','chips'),body=el('div');let active=tables[0].name;
  const show=async()=>{
    body.innerHTML='';
    const meta=tables.find(t=>t.name===active);
    body.appendChild(el('p','note',meta.note+'   '+fmt(meta.rows)+' rows.'));
    const d=await api(`/api/table/${active}?tenant=${S.tenant}&limit=100`);
    const p=el('div','qcard');
    p.appendChild(d.rows.length?dataTable(d.rows):el('div','empty','Nothing in this table yet.'));
    body.appendChild(p);
  };
  tables.forEach(t=>{
    const b=el('button','qchip',t.name+'  '+fmt(t.rows));
    b.setAttribute('aria-pressed',String(t.name===active));
    b.onclick=()=>{active=t.name;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));show();};
    chips.appendChild(b);});
  add(v,chips,body);show();
}

/* ---------------------------------------------------------------- definitions */
async function pageDefs(v){
  add(v,el('h2',null,'Definitions'),
        el('p','lede','What each word means for this company. Two customers use the same word differently and both are right, so the meaning lives here as a setting rather than in the code. Pick a sentence, save it, and every answer that depends on that word is computed again under the new rule.'));
  let d;
  try{d=await api('/api/definitions?tenant='+S.tenant);}
  catch(e){v.appendChild(el('div','empty',e.message));return;}
  Object.entries(d.current).forEach(([word,info])=>{
    const pan=el('div','panel'),h=el('div','ph');
    h.appendChild(el('span','ref',word.replace(/_/g,' ')));
    h.appendChild(el('span','qn','in force since '+info.version));
    pan.appendChild(h);
    const wrap=el('div','dwrap'),picked={};
    Object.entries(info.params).forEach(([k,val])=>{
      const spec=(d.schema[word]||{})[k]||{};
      const f=el('div','dsec');
      f.appendChild(el('p','dq',spec.note||k.replace(/_/g,' ')));
      const opts=spec.options||[];
      if(opts.length){
        /* Not a dropdown of fifo and lifo. A choice between two sentences, each with the
           consequence written underneath it, because that is what somebody is signing. */
        const list=el('div','dopts');
        opts.forEach(o=>{
          const card=el('label','dopt'+(String(o.value)===String(val)?' on':''));
          const rd=el('input');rd.type='radio';rd.name=word+'.'+k;
          rd.checked=String(o.value)===String(val);
          rd.onchange=()=>{picked[k]=o.value;
            list.querySelectorAll('.dopt').forEach(n=>n.classList.remove('on'));
            card.classList.add('on');};
          const bd=el('div','ob');
          add(bd,el('b',null,o.label),el('span',null,o.detail));
          add(card,rd,bd);list.appendChild(card);
        });
        f.appendChild(list);
      }else{
        const i=el('input');i.type='number';i.step='0.01';i.value=val;
        i.oninput=()=>{picked[k]=parseFloat(i.value);};
        const row=el('div','dnum');
        add(row,i,el('span',null,'currently '+val));
        f.appendChild(row);
      }
      wrap.appendChild(f);
    });
    pan.appendChild(wrap);
    const b=el('button','save','Save and recompute every answer that uses this word');
    b.onclick=async()=>{
      const params=Object.assign({},info.params,picked);
      try{await post('/api/definitions',{tenant:S.tenant,word,params});
        S.answers={};toast('Saved. Every answer using \u201c'+word+'\u201d has been recomputed.');
        draw();}
      catch(e){toast(e.message);}
    };
    pan.appendChild(b);v.appendChild(pan);
  });
}

/* When the company changes, the definitions change with it, and that is the whole point of
   the exercise. Rather than leaving the evaluator to go and look, the difference is put on
   screen for a few seconds: the word, what it meant, what it means now. */
async function showDefDiff(prevTenant,prevDefs){
  let now;try{now=await api('/api/definitions?tenant='+S.tenant);}catch(e){return;}
  S.defs=now;
  if(!prevDefs)return;
  const rows=[];
  Object.entries(now.chosen||{}).forEach(([word,fields])=>{
    Object.entries(fields).forEach(([k,cur])=>{
      const was=((prevDefs.chosen||{})[word]||{})[k];
      if(!was||String(was.value)===String(cur.value))return;
      rows.push({word,key:k,from:was.label||String(was.value),to:cur.label||String(cur.value)});
    });
  });
  if(!rows.length)return;
  const bar=el('div','diff');
  const h=el('div','dh');
  add(h,el('b',null,rows.length+' definition'+(rows.length>1?'s':'')+' changed with the company'),
        el('span',null,'the same twenty questions now compute under different rules'));
  bar.appendChild(h);
  rows.forEach((r,i)=>{
    const line=el('div','dr');
    line.style.animationDelay=(0.06*i+0.1)+'s';
    add(line,el('span','w',r.word.replace(/_/g,' ')),
             el('span','was',r.from),
             el('span','arw','\u2192'),
             el('span','now',r.to));
    bar.appendChild(line);
  });
  const host=$('#view');host.insertBefore(bar,host.firstChild);
  requestAnimationFrame(()=>bar.classList.add('in'));
  setTimeout(()=>{bar.classList.remove('in');setTimeout(()=>bar.remove(),500);},9000);
}

/* ---------------------------------------------------------------- shell */
async function loadSummary(){S.summary=await api('/api/summary?tenant='+S.tenant);drawTabs();}
async function loadTenant(){
  const prevDefs=S.defs,prevTenant=S.lastTenant;
  const [q,o,m]=await Promise.all([api('/api/questions?tenant='+S.tenant),
    api('/api/options?tenant='+S.tenant),api('/api/metrics')]);
  S.questions=q;S.options=o;S.metrics=m;S.answers={};S.lastTenant=S.tenant;
  await loadSummary();draw();
  showDefDiff(prevTenant,prevTenant&&prevTenant!==S.tenant?prevDefs:null);
}
function draw(){
  const v=$('#view');v.innerHTML='';
  ({story:pageStory,ask:pageAsk,review:pageReview,data:pageData,
    defs:pageDefs})[S.page](v);
}
(async()=>{
  const ts=await api('/api/tenants'),sel=$('#tenant');
  ts.forEach(t=>{const o=el('option',null,t.name);o.value=t.tenant_id;sel.appendChild(o);});
  S.tenant=ts[0].tenant_id;
  sel.onchange=()=>{S.tenant=sel.value;loadTenant();};
  await loadTenant();
})().catch(e=>{
  $('#view').innerHTML='<div class="empty"><b>Cannot reach the database.</b><br><br>Start Postgres, then <code>python db/load.py</code>, then reload this page.<br><br>'+e.message+'</div>';
});
</script>
